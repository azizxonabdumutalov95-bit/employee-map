<!DOCTYPE html>
<html lang="uz">
<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Филиаллар бошқаруви</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      color: #222;
    }

    .container {
      max-width: 1000px;
      margin: 0 auto;
      padding: 20px;
    }

    .top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 20px;
    }

    h1 {
      margin: 0;
    }

    button {
      border: 0;
      border-radius: 8px;
      padding: 10px 14px;
      cursor: pointer;
      font-size: 14px;
    }

    .add-btn {
      background: #198754;
      color: white;
    }

    .form-box {
      display: none;
      background: white;
      padding: 20px;
      border-radius: 12px;
      margin-bottom: 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,.08);
    }

    .form-box.show {
      display: block;
    }

    label {
      display: block;
      font-weight: bold;
      margin-bottom: 5px;
    }

    input {
      width: 100%;
      padding: 11px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 15px;
    }

    .save-btn {
      background: #0d6efd;
      color: white;
      margin-top: 15px;
    }

    .cancel-btn {
      background: #6c757d;
      color: white;
      margin-top: 15px;
      margin-left: 8px;
    }

    .message {
      margin: 15px 0;
      padding: 12px;
      border-radius: 8px;
      display: none;
    }

    .success {
      background: #d1e7dd;
      color: #0f5132;
    }

    .error {
      background: #f8d7da;
      color: #842029;
    }

    .search-box {
      background: white;
      padding: 15px;
      border-radius: 12px;
      margin-bottom: 15px;
      box-shadow: 0 2px 8px rgba(0,0,0,.08);
    }

    .search-box input {
      max-width: 500px;
    }

    .table-box {
      background: white;
      border-radius: 12px;
      overflow-x: auto;
      box-shadow: 0 2px 8px rgba(0,0,0,.08);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 700px;
    }

    th,
    td {
      padding: 12px;
      border-bottom: 1px solid #eee;
      text-align: left;
    }

    th {
      background: #f1f3f5;
    }

    .edit-btn {
      background: #ffc107;
      color: #222;
      margin-right: 5px;
    }

    .delete-btn {
      background: #dc3545;
      color: white;
    }

    .loading {
      text-align: center;
      padding: 30px;
    }

  </style>

</head>

<body>

<div class="container">

  <!-- HEADER -->

  <div class="top">

    <h1>
      🏢 Филиаллар бошқаруви
    </h1>

    <button
      class="add-btn"
      onclick="openAddForm()"
    >
      ➕ Филиал қўшиш
    </button>

  </div>


  <!-- MESSAGE -->

  <div
    id="message"
    class="message"
  ></div>


  <!-- FORM -->

  <div
    id="formBox"
    class="form-box"
  >

    <h2 id="formTitle">
      Янги филиал қўшиш
    </h2>

    <input
      id="editId"
      type="hidden"
    >

    <label>
      Филиал номи
    </label>

    <input
      id="branchName"
      type="text"
      placeholder="Масалан: Тошкент"
    >

    <button
      class="save-btn"
      onclick="saveBranch()"
    >
      💾 Сақлаш
    </button>

    <button
      class="cancel-btn"
      onclick="closeForm()"
    >
      Бекор қилиш
    </button>

  </div>


  <!-- SEARCH -->

  <div class="search-box">

    <label>
      🔎 Филиал қидириш
    </label>

    <input
      id="searchInput"
      type="text"
      placeholder="Филиал номини ёзинг..."
      oninput="filterBranches()"
    >

  </div>


  <!-- TABLE -->

  <div class="table-box">

    <table>

      <thead>

        <tr>

          <th>ID</th>

          <th>Филиал</th>

          <th>Ходимлар сони</th>

          <th>Амаллар</th>

        </tr>

      </thead>

      <tbody id="branchTable">

        <tr>

          <td
            colspan="4"
            class="loading"
          >
            Маълумотлар юкланмоқда...
          </td>

        </tr>

      </tbody>

    </table>

  </div>

</div>


<script>


/* =====================================================
   API
===================================================== */

const API =
  "https://qyvglgcjsqifyubmpahw.supabase.co/functions/v1/smart-endpoint";


/* =====================================================
   GLOBAL
===================================================== */

let branchesList = [];


/* =====================================================
   MESSAGE
===================================================== */

function showMessage(
  text,
  type
) {

  const box =
    document.getElementById(
      "message"
    );

  box.textContent =
    text;

  box.className =
    "message " +
    type;

  box.style.display =
    "block";

}


/* =====================================================
   ADD FORM
===================================================== */

function openAddForm() {

  document.getElementById(
    "formTitle"
  ).textContent =
    "Янги филиал қўшиш";

  document.getElementById(
    "editId"
  ).value =
    "";

  document.getElementById(
    "branchName"
  ).value =
    "";

  document.getElementById(
    "formBox"
  ).classList.add(
    "show"
  );

}


/* =====================================================
   CLOSE FORM
===================================================== */

function closeForm() {

  document.getElementById(
    "formBox"
  ).classList.remove(
    "show"
  );

}


/* =====================================================
   LOAD BRANCHES
===================================================== */

async function loadBranches() {

  const table =
    document.getElementById(
      "branchTable"
    );

  table.innerHTML = `
    <tr>
      <td
        colspan="4"
        class="loading"
      >
        ⏳ Филиаллар юкланмоқда...
      </td>
    </tr>
  `;


  try {

    const response =
      await fetch(
        API +
        "?view=branches"
      );


    const data =
      await response.json();


    console.log(
      "BRANCH API RESPONSE:",
      data
    );


    if (
      !response.ok
    ) {

      throw new Error(
        "HTTP " +
        response.status
      );

    }


    if (
      data.success === false
    ) {

      throw new Error(
        data.error ||
        data.message ||
        "Филиалларни олишда хато"
      );

    }


    /*
      API:
      {
        success: true,
        branches: [...]
      }
    */

    if (
      !Array.isArray(
        data.branches
      )
    ) {

      throw new Error(
        "API филиаллар рўйхатини нотўғри қайтарди"
      );

    }


    branchesList =
      data.branches.map(
        function(branch) {

          return {

            id:
              branch.id,

            name:
              branch.name,

            employee_count: b.employee_count || 0

          };

        }
      );


    console.log(
      "BRANCHES LIST:",
      branchesList
    );


    renderBranches(
      branchesList
    );


  } catch (error) {

    console.error(
      "LOAD BRANCHES ERROR:",
      error
    );


    table.innerHTML = `
      <tr>
        <td
          colspan="4"
          class="loading"
        >
          ❌ Хато: ${error.message}
        </td>
      </tr>
    `;

  }

}


/* =====================================================
   RENDER BRANCHES
===================================================== */

function renderBranches(
  branches
) {

  const table =
    document.getElementById(
      "branchTable"
    );


  table.innerHTML =
    "";


  if (
    !branches ||
    branches.length === 0
  ) {

    table.innerHTML = `
      <tr>
        <td
          colspan="4"
          class="loading"
        >
          Филиаллар топилмади
        </td>
      </tr>
    `;

    return;

  }


  branches.forEach(
    function(branch) {

      const row =
        document.createElement(
          "tr"
        );


      /* ID */

      const idCell =
        document.createElement(
          "td"
        );

      idCell.textContent =
        branch.id;


      /* NAME */

      const nameCell =
        document.createElement(
          "td"
        );

      nameCell.textContent =
        branch.name || "";


      /* EMPLOYEE COUNT */

      const countCell =
        document.createElement(
          "td"
        );

      countCell.textContent =
        branch.employee_count || 0;


      /* ACTIONS */

      const actionCell =
        document.createElement(
          "td"
        );


      /* EDIT */

      const editButton =
        document.createElement(
          "button"
        );

      editButton.className =
        "edit-btn";

      editButton.textContent =
        "✏️ Таҳрир";

      editButton.onclick =
        function() {

          editBranch(
            branch
          );

        };


      /* DELETE */

      const deleteButton =
        document.createElement(
          "button"
        );

      deleteButton.className =
        "delete-btn";

      deleteButton.textContent =
        "🗑 Ўчириш";

      deleteButton.onclick =
        function() {

          deleteBranch(
            branch
          );

        };


      actionCell.appendChild(
        editButton
      );

      actionCell.appendChild(
        deleteButton
      );


      row.appendChild(
        idCell
      );

      row.appendChild(
        nameCell
      );

      row.appendChild(
        countCell
      );

      row.appendChild(
        actionCell
      );


      table.appendChild(
        row
      );

    }
  );

}


/* =====================================================
   SEARCH
===================================================== */

function filterBranches() {

  const search =
    document
      .getElementById(
        "searchInput"
      )
      .value
      .toLowerCase()
      .trim();


  if (
    search === ""
  ) {

    renderBranches(
      branchesList
    );

    return;

  }


  const filtered =
    branchesList.filter(
      function(branch) {

        return String(
          branch.name || ""
        )
        .toLowerCase()
        .includes(
          search
        );

      }
    );


  renderBranches(
    filtered
  );

}


/* =====================================================
   EDIT BRANCH
===================================================== */

function editBranch(
  branch
) {

  document.getElementById(
    "formTitle"
  ).textContent =
    "✏️ Филиални таҳрирлаш";


  document.getElementById(
    "editId"
  ).value =
    branch.id;


  document.getElementById(
    "branchName"
  ).value =
    branch.name || "";


  document.getElementById(
    "formBox"
  ).classList.add(
    "show"
  );


  window.scrollTo(
    {
      top: 0,
      behavior: "smooth"
    }
  );

}


/* =====================================================
   SAVE BRANCH
===================================================== */

async function saveBranch() {

  const editId =
    document.getElementById(
      "editId"
    ).value;


  const name =
    document.getElementById(
      "branchName"
    ).value
    .trim();


  if (
    name === ""
  ) {

    showMessage(
      "❌ Филиал номини киритинг",
      "error"
    );

    return;

  }


  /*
    ҲОЗИРЧА ФАҚАТ ҚЎШИШ
  */

  if (
    editId
  ) {

    showMessage(
      "⚠️ Таҳрирлаш API кейинги босқичда қўшилади.",
      "error"
    );

    return;

  }


  try {

    const response =
      await fetch(
        API +
        "?view=branch_add",
        {

          method:
            "POST",

          headers: {
            "Content-Type":
              "application/json"
          },

          body:
            JSON.stringify(
              {
                name:
                  name
              }
            )

        }
      );


    const data =
      await response.json();


    console.log(
      "ADD BRANCH RESPONSE:",
      data
    );


    if (
      !response.ok ||
      data.success === false
    ) {

      throw new Error(
        data.error ||
        data.message ||
        "Филиал қўшилмади"
      );

    }


    showMessage(
      "✅ Филиал муваффақиятли қўшилди",
      "success"
    );


    closeForm();


    await loadBranches();


  } catch (error) {

    console.error(
      "ADD BRANCH ERROR:",
      error
    );


    showMessage(
      "❌ " +
      error.message,
      "error"
    );

  }

}


/* =====================================================
   DELETE BRANCH
===================================================== */

async function deleteBranch(branch) {

  const confirmed = confirm(
    "⚠️ " +
    branch.name +
    "\n\n" +
    "Ушбу филиални ўчиришни тасдиқлайсизми?"
  );

  if (!confirmed) {
    return;
  }

  try {

    showMessage(
      "⏳ Филиал ўчирилмоқда...",
      "info"
    );

    const response =
      await fetch(
        API +
        "?view=branch_delete&id=" +
        encodeURIComponent(branch.id),
        {
          method: "DELETE"
        }
      );

    const data =
      await response.json();

    if (!response.ok || !data.success) {

      throw new Error(
        data.error ||
        "Филиални ўчиришда хато"
      );

    }

    showMessage(
      "✅ " +
      branch.name +
      " филиали ўчирилди.",
      "success"
    );

    await loadBranches();

  } catch (error) {

    console.error(
      "DELETE BRANCH ERROR:",
      error
    );

    showMessage(
      "❌ " +
      (error.message ||
      "Филиални ўчиришда хато"),
      "error"
    );

  }

}
/* =====================================================
   START
===================================================== */

loadBranches();

</script>

</body>
</html>
