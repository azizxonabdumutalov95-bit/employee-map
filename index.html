<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Xodimlar GPS</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f3f4f6;
      color: #222;
    }

    header {
      background: #ffffff;
      padding: 18px;
      border-bottom: 1px solid #ddd;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    h2 {
      margin: 0 0 8px 0;
    }

    #status {
      color: #666;
      font-size: 14px;
    }

    #employees {
      padding: 12px;
    }

    .employee {
      background: #ffffff;
      margin-bottom: 12px;
      padding: 16px;
      border-radius: 12px;
      border: 1px solid #ddd;
    }

    .name {
      font-size: 19px;
      font-weight: bold;
      margin-bottom: 6px;
    }

    .branch {
      color: #555;
      margin-bottom: 10px;
    }

    .gps {
      background: #f1f5f9;
      padding: 10px;
      border-radius: 8px;
      font-family: monospace;
      margin-top: 8px;
    }

    .time {
      margin-top: 8px;
      color: #777;
      font-size: 13px;
    }

    .map-button {
      display: inline-block;
      margin-top: 12px;
      padding: 11px 15px;
      background: #2563eb;
      color: white;
      text-decoration: none;
      border-radius: 8px;
    }

    .no-gps {
      color: #999;
      margin-top: 8px;
    }

    .error {
      margin: 12px;
      padding: 15px;
      background: #fee2e2;
      color: #991b1b;
      border-radius: 10px;
    }

    .loading {
      padding: 20px;
      text-align: center;
      color: #666;
    }
  </style>
</head>

<body>

<header>
  <h2>Xodimlar GPS</h2>
  <div id="status">
    Ma'lumotlar yuklanmoqda...
  </div>
</header>

<div id="employees">
  <div class="loading">
    Yuklanmoqda...
  </div>
</div>

<script>

const ENDPOINT =
  "https://qyvglgcjsqifyubmpahw.supabase.co/functions/v1/smart-endpoint";

const employeesContainer =
  document.getElementById("employees");

const statusElement =
  document.getElementById("status");


function escapeHtml(value) {

  return String(value ?? "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");

}


async function loadEmployees() {

  try {

    statusElement.textContent =
      "GPS ma'lumotlari yuklanmoqda...";

    const response =
      await fetch(
        ENDPOINT + "?view=data&t=" + Date.now(),
        {
          method: "GET",
          cache: "no-store"
        }
      );

    const data =
      await response.json();

    if (!response.ok) {

      throw new Error(
        data.error ||
        "Server xatosi"
      );

    }

    if (!Array.isArray(data)) {

      throw new Error(
        "Server noto'g'ri ma'lumot qaytardi."
      );

    }

    employeesContainer.innerHTML = "";

    let gpsCount = 0;

    for (
      const employee of data
    ) {

      const card =
        document.createElement("div");

      card.className =
        "employee";


      const name =
        employee.full_name ||
        "Noma'lum xodim";


      const branch =
        employee.branch_name ||
        "Filial ko'rsatilmagan";


      const latitude =
        Number(employee.latitude);


      const longitude =
        Number(employee.longitude);


      const hasGps =
        Number.isFinite(latitude) &&
        Number.isFinite(longitude);


      let html = "";


      html +=
        '<div class="name">' +
        escapeHtml(name) +
        '</div>';


      html +=
        '<div class="branch">' +
        'Filial: ' +
        escapeHtml(branch) +
        '</div>';


      if (hasGps) {

        gpsCount++;


        html +=
          '<div class="gps">' +
          'Latitude: ' +
          latitude.toFixed(6) +
          '<br>' +
          'Longitude: ' +
          longitude.toFixed(6) +
          '</div>';


        html +=
          '<div class="time">' +
          'Oxirgi GPS: ' +
          escapeHtml(
            employee.last_location_at || "-"
          ) +
          '</div>';


        const mapUrl =
          "https://www.google.com/maps?q=" +
          latitude +
          "," +
          longitude;


        html +=
          '<a class="map-button" ' +
          'href="' +
          mapUrl +
          '" ' +
          'target="_blank" ' +
          'rel="noopener noreferrer">' +
          'Google Maps da ochish' +
          '</a>';


      } else {

        html +=
          '<div class="no-gps">' +
          'GPS ma\'lumoti hali mavjud emas.' +
          '</div>';

      }


      card.innerHTML =
        html;


      employeesContainer.appendChild(
        card
      );

    }


    statusElement.textContent =
      "Jami xodimlar: " +
      data.length +
      " | GPS mavjud: " +
      gpsCount +
      " | Har 30 sekundda yangilanadi";


  } catch (error) {

    console.error(
      "GPS ERROR:",
      error
    );


    statusElement.textContent =
      "Xatolik yuz berdi";


    employeesContainer.innerHTML =
      '<div class="error">' +
      '<b>Xodimlar ma\'lumotini olishda xato</b>' +
      '<br><br>' +
      escapeHtml(
        error.message ||
        String(error)
      ) +
      '</div>';

  }

}


loadEmployees();


setInterval(
  loadEmployees,
  30000
);

</script>

</body>
</html>
