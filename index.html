<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Xodimlar GPS</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f1f5f9;
      color: #172033;
    }

    header {
      background: #ffffff;
      padding: 18px;
      border-bottom: 1px solid #e2e8f0;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .header-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    h2 {
      margin: 0;
      font-size: 23px;
    }

    #status {
      color: #64748b;
      font-size: 13px;
      margin-top: 7px;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      padding: 12px;
    }

    .stat {
      background: white;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      padding: 14px;
      text-align: center;
    }

    .stat-number {
      font-size: 23px;
      font-weight: bold;
    }

    .stat-label {
      color: #64748b;
      font-size: 12px;
      margin-top: 4px;
    }

    #employees {
      padding: 0 12px 20px 12px;
    }

    .employee {
      background: #ffffff;
      margin-bottom: 12px;
      padding: 16px;
      border-radius: 15px;
      border: 1px solid #e2e8f0;
      box-shadow: 0 2px 8px rgba(15, 23, 42, 0.05);
    }

    .employee-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 10px;
    }

    .name {
      font-size: 19px;
      font-weight: bold;
      margin-bottom: 6px;
    }

    .branch {
      color: #64748b;
      font-size: 14px;
    }

    .status-badge {
      padding: 6px 9px;
      border-radius: 20px;
      font-size: 12px;
      white-space: nowrap;
      font-weight: bold;
    }

    .working {
      background: #dcfce7;
      color: #166534;
    }

    .not-working {
      background: #f1f5f9;
      color: #64748b;
    }

    .info {
      margin-top: 14px;
      border-top: 1px solid #f1f5f9;
      padding-top: 12px;
    }

    .info-row {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      padding: 6px 0;
      font-size: 14px;
    }

    .info-label {
      color: #64748b;
    }

    .info-value {
      font-weight: 600;
      text-align: right;
    }

    .gps {
      background: #f8fafc;
      padding: 11px;
      border-radius: 9px;
      margin-top: 10px;
      font-family: monospace;
      font-size: 13px;
      line-height: 1.6;
    }

    .gps-title {
      font-family: Arial, sans-serif;
      font-weight: bold;
      margin-bottom: 3px;
    }

    .map-button {
      display: block;
      text-align: center;
      margin-top: 12px;
      padding: 12px 15px;
      background: #2563eb;
      color: white;
      text-decoration: none;
      border-radius: 9px;
      font-weight: bold;
    }

    .map-button:hover {
      background: #1d4ed8;
    }

    .no-gps {
      background: #f8fafc;
      color: #94a3b8;
      padding: 11px;
      border-radius: 9px;
      margin-top: 10px;
      font-size: 13px;
    }

    .loading {
      padding: 30px;
      text-align: center;
      color: #64748b;
    }

    .error {
      margin: 12px 0;
      padding: 15px;
      background: #fee2e2;
      color: #991b1b;
      border-radius: 10px;
    }

    @media (max-width: 600px) {

      .stats {
        grid-template-columns: 1fr 1fr 1fr;
        gap: 7px;
      }

      .stat {
        padding: 10px 5px;
      }

      .stat-number {
        font-size: 19px;
      }

      .stat-label {
        font-size: 10px;
      }

      .employee-header {
        align-items: flex-start;
      }

      .name {
        font-size: 17px;
      }

      .info-row {
        font-size: 13px;
      }
    }
  </style>
</head>

<body>

<header>

  <div class="header-top">
    <h2>🗺 Xodimlar GPS</h2>
  </div>

  <div id="status">
    Ma'lumotlar yuklanmoqda...
  </div>

</header>


<div class="stats">

  <div class="stat">
    <div
      class="stat-number"
      id="totalCount"
    >
      0
    </div>

    <div class="stat-label">
      👤 Jami xodim
    </div>
  </div>


  <div class="stat">
    <div
      class="stat-number"
      id="workingCount"
    >
      0
    </div>

    <div class="stat-label">
      🟢 Ishda
    </div>
  </div>


  <div class="stat">
    <div
      class="stat-number"
      id="gpsCount"
    >
      0
    </div>

    <div class="stat-label">
      📍 GPS
    </div>
  </div>

</div>


<div id="employees">

  <div class="loading">
    ⏳ Yuklanmoqda...
  </div>

</div>


<script>

const ENDPOINT =
  "https://qyvglgcjsqifyubmpahw.supabase.co/functions/v1/smart-endpoint";


const employeesContainer =
  document.getElementById("employees");

const statusElement =
  document.getElementById("status");

const totalCount =
  document.getElementById("totalCount");

const workingCount =
  document.getElementById("workingCount");

const gpsCountElement =
  document.getElementById("gpsCount");


function escapeHtml(value) {

  return String(value ?? "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");

}


function formatDateTime(value) {

  if (!value) {
    return "-";
  }

  const date =
    new Date(value);

  if (isNaN(date.getTime())) {
    return value;
  }

  return date.toLocaleString(
    "uz-UZ",
    {
      day: "2-digit",
      month: "2-digit",
      year: "numeric",
      hour: "2-digit",
      minute: "2-digit"
    }
  );

}


function isWorking(employee) {

  return Boolean(
    employee.work_started_at &&
    !employee.work_ended_at
  );

}


async function loadEmployees() {

  try {

    statusElement.textContent =
      "🔄 GPS ma'lumotlari yangilanmoqda...";


    const response =
      await fetch(
        ENDPOINT +
        "?view=data&t=" +
        Date.now(),
        {
          method: "GET",
          cache: "no-store"
        }
      );


    const data =
      await response.json();


    if (!response.ok) {

      throw new Error(
        data.error ||
        "Server xatosi"
      );

    }


    if (!Array.isArray(data)) {

      throw new Error(
        "Server noto'g'ri ma'lumot qaytardi."
      );

    }


    employeesContainer.innerHTML = "";


    let gpsCount = 0;
    let workingCountValue = 0;


    for (
      const employee of data
    ) {

      const card =
        document.createElement("div");

      card.className =
        "employee";


      const name =
        employee.full_name ||
        "Noma'lum xodim";


      const branch =
        employee.branch_name ||
        "Filial ko'rsatilmagan";


      const latitude =
        Number(employee.latitude);


      const longitude =
        Number(employee.longitude);


      const hasGps =
        Number.isFinite(latitude) &&
        Number.isFinite(longitude);


      const working =
        isWorking(employee);


      if (hasGps) {
        gpsCount++;
      }


      if (working) {
        workingCountValue++;
      }


      let html = "";


      html +=
        '<div class="employee-header">';


      html +=
        '<div>' +

        '<div class="name">' +
        '👤 ' +
        escapeHtml(name) +
        '</div>' +

        '<div class="branch">' +
        '🏢 ' +
        escapeHtml(branch) +
        '</div>' +

        '</div>';


      if (working) {

        html +=
          '<div class="status-badge working">' +
          '🟢 Ishda' +
          '</div>';

      } else {

        html +=
          '<div class="status-badge not-working">' +
          '⚪ Ishda emas' +
          '</div>';

      }


      html +=
        '</div>';


      html +=
        '<div class="info">';


      if (employee.work_started_at) {

        html +=
          '<div class="info-row">' +

          '<span class="info-label">' +
          '🕐 Ish boshlangan:' +
          '</span>' +

          '<span class="info-value">' +
          escapeHtml(
            formatDateTime(
              employee.work_started_at
            )
          ) +
          '</span>' +

          '</div>';

      }


      if (employee.last_location_at) {

        html +=
          '<div class="info-row">' +

          '<span class="info-label">' +
          '📍 Oxirgi GPS:' +
          '</span>' +

          '<span class="info-value">' +
          escapeHtml(
            formatDateTime(
              employee.last_location_at
            )
          ) +
          '</span>' +

          '</div>';

      }


      if (hasGps) {

        html +=
          '<div class="gps">' +

          '<div class="gps-title">' +
          '📌 Joylashuv' +
          '</div>' +

          'Latitude: ' +
          latitude.toFixed(6) +

          '<br>' +

          'Longitude: ' +
          longitude.toFixed(6) +

          '</div>';


        const mapUrl =
          "https://www.google.com/maps?q=" +
          latitude +
          "," +
          longitude;


        html +=
          '<a class="map-button" ' +

          'href="' +
          mapUrl +
          '" ' +

          'target="_blank" ' +

          'rel="noopener noreferrer">' +

          '🗺 Google Maps da ochish' +

          '</a>';

      } else {

        html +=
          '<div class="no-gps">' +
          '📍 GPS ma\'lumoti hali mavjud emas.' +
          '</div>';

      }


      html +=
        '</div>';


      card.innerHTML =
        html;


      employeesContainer.appendChild(
        card
      );

    }


    totalCount.textContent =
      data.length;


    workingCount.textContent =
      workingCountValue;


    gpsCountElement.textContent =
      gpsCount;


    statusElement.textContent =
      "✅ Yangilandi: " +
      new Date().toLocaleTimeString(
        "uz-UZ"
      ) +
      " | Автоматик янгиланиш: 30 сек.";


  } catch (error) {

    console.error(
      "GPS ERROR:",
      error
    );


    statusElement.textContent =
      "❌ Xatolik yuz berdi";


    employeesContainer.innerHTML =
      '<div class="error">' +

      '<b>❌ Xodimlar ma\'lumotini olishda xato</b>' +

      '<br><br>' +

      escapeHtml(
        error.message ||
        String(error)
      ) +

      '</div>';

  }

}


loadEmployees();


setInterval(
  loadEmployees,
  30000
);

</script>

</body>
</html>
