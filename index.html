<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Xodimlar nazorati</title>

  <!-- Leaflet -->
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  />

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family:
        Arial,
        Helvetica,
        sans-serif;
      background: #f3f4f6;
      color: #111827;
    }

    header {
      background: #111827;
      color: white;
      padding: 18px 20px;
    }

    header h1 {
      margin: 0 0 6px 0;
      font-size: 22px;
    }

    header p {
      margin: 0;
      color: #d1d5db;
      font-size: 14px;
    }

    .container {
      width: 100%;
      max-width: 1500px;
      margin: 0 auto;
      padding: 15px;
    }

    /* =========================
       STATISTICS
    ========================= */

    .stats {
      display: grid;
      grid-template-columns:
        repeat(4, minmax(0, 1fr));

      gap: 12px;
      margin-bottom: 15px;
    }

    .stat-card {
      background: white;
      border-radius: 12px;
      padding: 15px;
      box-shadow:
        0 2px 8px rgba(
          0,
          0,
          0,
          0.08
        );
    }

    .stat-title {
      font-size: 13px;
      color: #6b7280;
      margin-bottom: 6px;
    }

    .stat-value {
      font-size: 26px;
      font-weight: bold;
    }

    .stat-total .stat-value {
      color: #111827;
    }

    .stat-online .stat-value {
      color: #16a34a;
    }

    .stat-delayed .stat-value {
      color: #ca8a04;
    }

    .stat-offline .stat-value {
      color: #dc2626;
    }

    /* =========================
       MAP
    ========================= */

    .map-wrapper {
      background: white;
      border-radius: 12px;
      overflow: hidden;

      box-shadow:
        0 2px 8px rgba(
          0,
          0,
          0,
          0.08
        );

      margin-bottom: 15px;
    }

    .map-header {
      padding: 12px 15px;

      display: flex;
      align-items: center;
      justify-content: space-between;

      gap: 10px;

      border-bottom:
        1px solid #e5e7eb;
    }

    .map-title {
      font-size: 16px;
      font-weight: bold;
    }

    #map {
      width: 100%;
      height: 550px;
    }

    .map-status {
      font-size: 13px;
      color: #6b7280;
    }

    /* =========================
       ERROR
    ========================= */

    .error {
      display: none;

      background: #fee2e2;
      color: #991b1b;

      border:
        1px solid #fecaca;

      border-radius: 10px;

      padding: 12px 15px;

      margin-bottom: 15px;

      white-space: pre-wrap;
    }

    /* =========================
       EMPLOYEE GRID
    ========================= */

    .employees-title {
      font-size: 19px;
      font-weight: bold;

      margin:
        20px 0 12px;
    }

    .employees {
      display: grid;

      grid-template-columns:
        repeat(
          auto-fill,
          minmax(300px, 1fr)
        );

      gap: 14px;
    }

    .employee-card {
      background: white;

      border-radius: 12px;

      padding: 15px;

      box-shadow:
        0 2px 8px rgba(
          0,
          0,
          0,
          0.08
        );

      border:
        1px solid #e5e7eb;
    }

    .employee-top {
      display: flex;

      align-items: flex-start;

      justify-content: space-between;

      gap: 10px;

      margin-bottom: 12px;
    }

    .employee-name {
      font-size: 17px;
      font-weight: bold;
      margin-bottom: 4px;
    }

    .employee-branch {
      font-size: 13px;
      color: #6b7280;
    }

    /* =========================
       STATUS
    ========================= */

    .status {
      display: inline-flex;

      align-items: center;

      gap: 5px;

      border-radius: 20px;

      padding:
        5px 9px;

      font-size: 12px;

      font-weight: bold;

      white-space: nowrap;
    }

    .status-online {
      background: #dcfce7;
      color: #166534;
    }

    .status-delayed {
      background: #fef9c3;
      color: #854d0e;
    }

    .status-offline {
      background: #fee2e2;
      color: #991b1b;
    }

    .status-none {
      background: #e5e7eb;
      color: #374151;
    }

    /* =========================
       EMPLOYEE INFO
    ========================= */

    .info-row {
      display: flex;

      justify-content: space-between;

      gap: 10px;

      padding: 7px 0;

      border-bottom:
        1px solid #f3f4f6;

      font-size: 13px;
    }

    .info-row:last-child {
      border-bottom: none;
    }

    .info-label {
      color: #6b7280;
    }

    .info-value {
      text-align: right;
      font-weight: 500;
    }

    .working {
      color: #16a34a;
      font-weight: bold;
    }

    .stopped {
      color: #dc2626;
      font-weight: bold;
    }

    /* =========================
       BUTTONS
    ========================= */

    .buttons {
      display: grid;

      grid-template-columns:
        repeat(
          3,
          minmax(0, 1fr)
        );

      gap: 7px;

      margin-top: 12px;
    }

    button {
      border: none;

      border-radius: 8px;

      padding: 9px 8px;

      font-size: 12px;

      font-weight: bold;

      cursor: pointer;

      transition:
        opacity 0.15s,
        transform 0.1s;
    }

    button:hover {
      opacity: 0.9;
    }

    button:active {
      transform: scale(0.98);
    }

    .btn-map {
      background: #2563eb;
      color: white;
    }

    .btn-route {
      background: #7c3aed;
      color: white;
    }

    .btn-google {
      background: #16a34a;
      color: white;
    }

    /* =========================
       EMPTY
    ========================= */

    .empty {
      background: white;

      border-radius: 12px;

      padding: 30px;

      text-align: center;

      color: #6b7280;
    }

    /* =========================
       LOADING
    ========================= */

    .loading {
      text-align: center;

      padding: 25px;

      color: #6b7280;
    }

    /* =========================
       LEAFLET POPUP
    ========================= */

    .popup-title {
      font-weight: bold;

      font-size: 15px;

      margin-bottom: 7px;
    }

    .popup-row {
      font-size: 12px;

      margin:
        4px 0;
    }

    .popup-google {
      display: inline-block;

      margin-top: 7px;

      padding: 6px 9px;

      background: #16a34a;

      color: white;

      text-decoration: none;

      border-radius: 6px;

      font-size: 12px;
    }

    /* =========================
       RESPONSIVE
    ========================= */

    @media (
      max-width: 800px
    ) {

      .stats {
        grid-template-columns:
          repeat(2, 1fr);
      }

      #map {
        height: 430px;
      }

    }

    @media (
      max-width: 500px
    ) {

      .container {
        padding: 10px;
      }

      .stats {
        grid-template-columns:
          1fr 1fr;
      }

      .buttons {
        grid-template-columns:
          1fr;
      }

      #map {
        height: 380px;
      }

    }

  </style>
</head>

<body>

  <header>

    <h1>
      👥 Xodimlar nazorati
    </h1>

    <p>
      GPS • Ish vaqti • Online holat • Marshrut
    </p>

  </header>


  <div class="container">

    <!-- ERROR -->

    <div
      id="error"
      class="error"
    ></div>


    <!-- STATISTICS -->

    <div class="stats">

      <div
        class="stat-card stat-total"
      >

        <div class="stat-title">
          👥 Jami xodimlar
        </div>

        <div
          id="totalCount"
          class="stat-value"
        >
          0
        </div>

      </div>


      <div
        class="stat-card stat-online"
      >

        <div class="stat-title">
          🟢 Online
        </div>

        <div
          id="onlineCount"
          class="stat-value"
        >
          0
        </div>

      </div>


      <div
        class="stat-card stat-delayed"
      >

        <div class="stat-title">
          🟡 Kechikkan
        </div>

        <div
          id="delayedCount"
          class="stat-value"
        >
          0
        </div>

      </div>


      <div
        class="stat-card stat-offline"
      >

        <div class="stat-title">
          🔴 Offline
        </div>

        <div
          id="offlineCount"
          class="stat-value"
        >
          0
        </div>

      </div>

    </div>


    <!-- MAP -->

    <div class="map-wrapper">

      <div class="map-header">

        <div class="map-title">
          🗺️ Xodimlar xaritasi
        </div>

        <div
          id="mapStatus"
          class="map-status"
        >
          Yuklanmoqda...
        </div>

      </div>

      <div id="map"></div>

    </div>


    <!-- EMPLOYEES -->

    <div class="employees-title">
      👥 Xodimlar
    </div>

    <div
      id="employees"
      class="employees"
    >

      <div class="loading">
        Xodimlar yuklanmoqda...
      </div>

    </div>

  </div>


  <!-- LEAFLET -->

  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
  ></script>


  <script>

    /* =====================================================
       CONFIG
    ===================================================== */

    const ENDPOINT =
      "https://qyvglgcjsqifyubmpahw.supabase.co/functions/v1/smart-endpoint";


    /* =====================================================
       GLOBAL
    ===================================================== */

    let map = null;

    let markers = {};

    let workTimer = null;

    let routeLayer = null;

    let routePointLayer = null;


    /* =====================================================
       HELPERS
    ===================================================== */

    function escapeHtml(
      value
    ) {

      if (
        value === null ||
        value === undefined
      ) {

        return "";

      }

      return String(value)
        .replace(
          /&/g,
          "&amp;"
        )
        .replace(
          /</g,
          "&lt;"
        )
        .replace(
          />/g,
          "&gt;"
        )
        .replace(
          /"/g,
          "&quot;"
        )
        .replace(
          /'/g,
          "&#039;"
        );

    }


    function formatDate(
      value
    ) {

      if (!value) {
        return "—";
      }

      const date =
        new Date(value);

      if (
        Number.isNaN(
          date.getTime()
        )
      ) {

        return "—";

      }

      return date.toLocaleString(
        "uz-UZ"
      );

    }


    function formatDuration(
      totalSeconds
    ) {

      totalSeconds =
        Math.max(
          0,
          Math.floor(
            Number(
              totalSeconds || 0
            )
          )
        );

      const hours =
        Math.floor(
          totalSeconds / 3600
        );

      const minutes =
        Math.floor(
          (totalSeconds % 3600) /
          60
        );

      const seconds =
        totalSeconds % 60;

      return (
        String(hours).padStart(
          2,
          "0"
        ) +
        ":" +
        String(minutes).padStart(
          2,
          "0"
        ) +
        ":" +
        String(seconds).padStart(
          2,
          "0"
        )
      );

    }


    /* =====================================================
       WORK STATUS
    ===================================================== */

    function isWorking(
      employee
    ) {

      return Boolean(
        employee &&
        employee.work_started_at &&
        !employee.work_ended_at
      );

    }


    function getWorkSeconds(
      employee
    ) {

      if (
        !employee ||
        !employee.work_started_at
      ) {

        return 0;

      }


      if (
        employee.work_duration_seconds !==
        null &&
        employee.work_duration_seconds !==
        undefined
      ) {

        return Number(
          employee.work_duration_seconds
        );

      }


      const start =
        new Date(
          employee.work_started_at
        ).getTime();


      if (
        Number.isNaN(start)
      ) {

        return 0;

      }


      const end =
        employee.work_ended_at
          ? new Date(
              employee.work_ended_at
            ).getTime()
          : Date.now();


      return Math.max(
        0,
        Math.floor(
          (end - start) / 1000
        )
      );

    }


    function updateWorkTimers() {

      document
        .querySelectorAll(
          "[data-employee-id]"
        )
        .forEach(
          function(card) {

            const id =
              Number(
                card.dataset.employeeId
              );

            const employee =
              window.employeeCache
                ? window.employeeCache[id]
                : null;

            if (!employee) {
              return;
            }


            const durationElement =
              card.querySelector(
                ".live-duration"
              );

            if (!durationElement) {
              return;
            }


            durationElement.textContent =
              formatDuration(
                getWorkSeconds(
                  employee
                )
              );

          }
        );

    }


    function startWorkTimer() {

      if (workTimer) {

        clearInterval(
          workTimer
        );

      }

      workTimer =
        setInterval(
          updateWorkTimers,
          1000
        );

    }


    /* =====================================================
       GPS STATUS
    ===================================================== */

    function getGpsAgeSeconds(
      employee
    ) {

      if (
        !employee ||
        !employee.last_location_at
      ) {

        return null;

      }


      const timestamp =
        new Date(
          employee.last_location_at
        ).getTime();


      if (
        Number.isNaN(timestamp)
      ) {

        return null;

      }


      return Math.max(
        0,
        Math.floor(
          (
            Date.now() -
            timestamp
          ) / 1000
        )
      );

    }


    function getGpsStatus(
      employee
    ) {

      const age =
        getGpsAgeSeconds(
          employee
        );


      if (
        age === null
      ) {

        return "none";

      }


      if (
        age <= 60
      ) {

        return "online";

      }


      if (
        age <= 300
      ) {

        return "delayed";

      }


      return "offline";

    }


    function getGpsStatusText(
      employee
    ) {

      const status =
        getGpsStatus(
          employee
        );


      if (
        status === "online"
      ) {

        return "🟢 Online";

      }


      if (
        status === "delayed"
      ) {

        return "🟡 Kechikkan";

      }


      if (
        status === "offline"
      ) {

        return "🔴 Offline";

      }


      return "⚪ GPS yo‘q";

    }


    function getGpsAgeText(
      employee
    ) {

      const age =
        getGpsAgeSeconds(
          employee
        );


      if (
        age === null
      ) {

        return "—";

      }


      if (
        age < 60
      ) {

        return (
          age +
          " soniya oldin"
        );

      }


      const minutes =
        Math.floor(
          age / 60
        );


      if (
        minutes < 60
      ) {

        return (
          minutes +
          " daqiqa oldin"
        );

      }


      const hours =
        Math.floor(
          minutes / 60
        );


      return (
        hours +
        " soat oldin"
      );

    }


    /* =====================================================
       MAP INIT
    ===================================================== */

    function initMap() {

      map =
        L.map(
          "map"
        ).setView(
          [
            40.215,
            69.25
          ],
          12
        );


      L.tileLayer(
        "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
        {
          maxZoom: 19,

          attribution:
            "&copy; OpenStreetMap contributors"
        }
      ).addTo(
        map
      );

    }


    /* =====================================================
       EMPLOYEE ICON
    ===================================================== */

    function createEmployeeIcon(
      employee
    ) {

      const status =
        getGpsStatus(
          employee
        );


      let color =
        "#6b7280";


      if (
        status === "online"
      ) {

        color =
          "#16a34a";

      }

      if (
        status === "delayed"
      ) {

        color =
          "#eab308";

      }

      if (
        status === "offline"
      ) {

        color =
          "#dc2626";

      }


      return L.divIcon({

        className:
          "employee-marker",

        html:
          `
          <div style="
            width:34px;
            height:34px;
            border-radius:50%;
            background:${color};
            border:4px solid white;
            box-shadow:
              0 2px 8px rgba(0,0,0,.35);
            display:flex;
            align-items:center;
            justify-content:center;
            color:white;
            font-weight:bold;
            font-size:16px;
          ">
            👤
          </div>
          `,

        iconSize:
          [
            34,
            34
          ],

        iconAnchor:
          [
            17,
            17
          ]

      });

    }


    /* =====================================================
       POPUP
    ===================================================== */

    function createPopup(
      employee
    ) {

      const working =
        isWorking(
          employee
        );


      const workStatus =
        working
          ? "🟢 Ishlayapti"
          : "🔴 Ishlamayapti";


      const lat =
        employee.latitude;


      const lng =
        employee.longitude;


      let googleLink =
        "";


      if (
        lat !== null &&
        lat !== undefined &&
        lng !== null &&
        lng !== undefined
      ) {

        googleLink =
          `
          <a
            class="popup-google"
            href="https://www.google.com/maps?q=${lat},${lng}"
            target="_blank"
          >
            Google Maps
          </a>
          `;

      }


      return `

        <div>

          <div class="popup-title">
            ${escapeHtml(
              employee.full_name
            )}
          </div>


          <div class="popup-row">
            🏢 Filial:
            <b>
              ${escapeHtml(
                employee.branch_name ||
                "—"
              )}
            </b>
          </div>


          <div class="popup-row">
            💼 Ish:
            <b>
              ${workStatus}
            </b>
          </div>


          <div class="popup-row">
            📡 GPS:
            <b>
              ${getGpsStatusText(
                employee
              )}
            </b>
          </div>


          <div class="popup-row">
            ⏱ Ish vaqti:
            <b class="popup-duration">
              ${formatDuration(
                getWorkSeconds(
                  employee
                )
              )}
            </b>
          </div>


          <div class="popup-row">
            🕐 Boshlangan:
            ${formatDate(
              employee.work_started_at
            )}
          </div>


          <div class="popup-row">
            📍 GPS:
            ${
              lat !== null &&
              lat !== undefined
                ? Number(lat).toFixed(6)
                : "—"
            },
            ${
              lng !== null &&
              lng !== undefined
                ? Number(lng).toFixed(6)
                : "—"
            }
          </div>


          <div class="popup-row">
            🕒 Oxirgi GPS:
            ${formatDate(
              employee.last_location_at
            )}
          </div>


          ${googleLink}

        </div>

      `;

    }


    /* =====================================================
       UPDATE MARKER
    ===================================================== */

    function updateMarker(
      employee
    ) {

      const id =
        employee.employee_id;


      const lat =
        Number(
          employee.latitude
        );


      const lng =
        Number(
          employee.longitude
        );


      if (
        !Number.isFinite(lat) ||
        !Number.isFinite(lng)
      ) {

        return;

      }


      if (
        markers[id]
      ) {

        markers[id]
          .setLatLng(
            [
              lat,
              lng
            ]
          )
          .setIcon(
            createEmployeeIcon(
              employee
            )
          )
          .setPopupContent(
            createPopup(
              employee
            )
          );

      } else {

        markers[id] =
          L.marker(
            [
              lat,
              lng
            ],
            {
              icon:
                createEmployeeIcon(
                  employee
                )
            }
          )
          .addTo(
            map
          )
          .bindPopup(
            createPopup(
              employee
            )
          );

      }

    }


    /* =====================================================
       REMOVE OLD MARKERS
    ===================================================== */

    function removeOldMarkers(
      currentIds
    ) {

      Object.keys(
        markers
      ).forEach(
        function(id) {

          if (
            !currentIds.has(
              Number(id)
            )
          ) {

            map.removeLayer(
              markers[id]
            );

            delete markers[id];

          }

        }
      );

    }


    /* =====================================================
       FIT MAP
    ===================================================== */

    function fitMapToMarkers() {

      const points =
        Object.values(
          markers
        )
        .map(
          function(marker) {
            return marker.getLatLng();
          }
        );


      if (
        points.length === 0
      ) {

        return;

      }


      if (
        points.length === 1
      ) {

        map.setView(
          points[0],
          15
        );

        return;

      }


      map.fitBounds(
        L.latLngBounds(
          points
        ),
        {
          padding:
            [
              40,
              40
            ]
        }
      );

    }


    /* =====================================================
       SHOW EMPLOYEE ON MAP
    ===================================================== */

    function showEmployeeOnMap(
      employee
    ) {

      const lat =
        Number(
          employee.latitude
        );

      const lng =
        Number(
          employee.longitude
        );


      if (
        !Number.isFinite(lat) ||
        !Number.isFinite(lng)
      ) {

        alert(
          "Xodimning GPS koordinatasi mavjud emas."
        );

        return;

      }


      map.setView(
        [
          lat,
          lng
        ],
        17
      );


      const marker =
        markers[
          employee.employee_id
        ];


      if (marker) {

        marker.openPopup();

      }

    }


    /* =====================================================
       SHOW EMPLOYEE ROUTE
    ===================================================== */

    async function showEmployeeRoute(
      employee
    ) {

      if (
        !employee ||
        !employee.employee_id
      ) {

        return;

      }


      try {

        document
          .getElementById(
            "mapStatus"
          )
          .textContent =
            "🗺️ Marshrut yuklanmoqda...";


        /*
          Oldingi marshrutni tozalaymiz
        */

        if (
          routeLayer
        ) {

          map.removeLayer(
            routeLayer
          );

          routeLayer =
            null;

        }


        if (
          routePointLayer
        ) {

          map.removeLayer(
            routePointLayer
          );

          routePointLayer =
            null;

        }


        const url =
          ENDPOINT +
          "?view=route&employee_id=" +
          encodeURIComponent(
            employee.employee_id
          );


        const response =
          await fetch(
            url,
            {
              method:
                "GET",

              headers: {
                "Accept":
                  "application/json"
              }
            }
          );


        if (
          !response.ok
        ) {

          throw new Error(
            "Server xatosi: HTTP " +
            response.status
          );

        }


        const route =
          await response.json();


        if (
          !Array.isArray(route)
        ) {

          throw new Error(
            "Marshrut ma'lumoti noto'g'ri formatda."
          );

        }


        /*
          Faqat to'g'ri GPS nuqtalarni olamiz
        */

        const points =
          route
            .filter(
              function(item) {

                const lat =
                  Number(
                    item.latitude
                  );

                const lng =
                  Number(
                    item.longitude
                  );


                return (
                  Number.isFinite(lat) &&
                  Number.isFinite(lng)
                );

              }
            )
            .map(
              function(item) {

                return {
                  ...item,

                  lat:
                    Number(
                      item.latitude
                    ),

                  lng:
                    Number(
                      item.longitude
                    )
                };

              }
            );


        if (
          points.length === 0
        ) {

          document
            .getElementById(
              "mapStatus"
            )
            .textContent =
              "📍 Marshrut topilmadi";


          alert(
            "Bu xodim uchun GPS marshrut ma'lumoti topilmadi."
          );

          return;

        }


        /*
          Marshrut chizig'i
        */

        const latLngs =
          points.map(
            function(point) {

              return [
                point.lat,
                point.lng
              ];

            }
          );


        routeLayer =
          L.polyline(
            latLngs,
            {
              color:
                "#2563eb",

              weight:
                5,

              opacity:
                0.85
            }
          ).addTo(
            map
          );


        /*
          Nuqtalar qatlami
        */

        routePointLayer =
          L.layerGroup()
            .addTo(
              map
            );


        points.forEach(
          function(point, index) {

            const time =
              point.recorded_at
                ? formatDate(
                    point.recorded_at
                  )
                : "—";


            const marker =
              L.circleMarker(
                [
                  point.lat,
                  point.lng
                ],
                {
                  radius:
                    5,

                  color:
                    "#1d4ed8",

                  fillColor:
                    "#60a5fa",

                  fillOpacity:
                    0.9,

                  weight:
                    2
                }
              );


            marker.bindPopup(
              `
                <b>
                  📍 GPS nuqta
                </b>
                <br>
                🕐 ${escapeHtml(
                  time
                )}
                <br>
                📌 ${point.lat.toFixed(
                  6
                )},
                ${point.lng.toFixed(
                  6
                )}
              `
            );


            marker.addTo(
              routePointLayer
            );

          }
        );


        /*
          Boshlanish nuqtasi
        */

        const first =
          points[0];


        L.circleMarker(
          [
            first.lat,
            first.lng
          ],
          {
            radius:
              9,

            color:
              "#166534",

            fillColor:
              "#22c55e",

            fillOpacity:
              1,

            weight:
              3
          }
        )
        .bindPopup(
          `
            <b>🟢 Boshlanish nuqtasi</b>
            <br>
            ${escapeHtml(
              first.recorded_at
                ? formatDate(
                    first.recorded_at
                  )
                : ""
            )}
          `
        )
        .addTo(
          routePointLayer
        );


        /*
          Tugash nuqtasi
        */

        if (
          points.length > 1
        ) {

          const last =
            points[
              points.length - 1
            ];


          L.circleMarker(
            [
              last.lat,
              last.lng
            ],
            {
              radius:
                9,

              color:
                "#991b1b",

              fillColor:
                "#ef4444",

              fillOpacity:
                1,

              weight:
                3
            }
          )
          .bindPopup(
            `
              <b>🔴 Tugash / oxirgi nuqta</b>
              <br>
              ${escapeHtml(
                last.recorded_at
                  ? formatDate(
                      last.recorded_at
                    )
                  : ""
              )}
            `
          )
          .addTo(
            routePointLayer
          );

        }


        /*
          Marshrutni to'liq ko'rsatish
        */

        map.fitBounds(
          routeLayer.getBounds(),
          {
            padding:
              [
                40,
                40
              ]
          }
        );


        document
          .getElementById(
            "mapStatus"
          )
          .textContent =
            "🗺️ " +
            escapeHtml(
              employee.full_name
            ) +
            " — " +
            points.length +
            " ta GPS nuqta";


      } catch (
        error
      ) {

        console.error(
          "ROUTE ERROR:",
          error
        );


        document
          .getElementById(
            "mapStatus"
          )
          .textContent =
            "❌ Marshrut xatosi";


        showError(
          "Marshrutni olishda xato:\n" +
          String(error)
        );

      }

    }


    /* =====================================================
       STATISTICS
    ===================================================== */

    function updateStatistics(
      employees
    ) {

      let online =
        0;

      let delayed =
        0;

      let offline =
        0;


      employees.forEach(
        function(employee) {

          const status =
            getGpsStatus(
              employee
            );


          if (
            status === "online"
          ) {

            online++;

          } else if (
            status === "delayed"
          ) {

            delayed++;

          } else if (
            status === "offline"
          ) {

            offline++;

          }

        }
      );


      document
        .getElementById(
          "totalCount"
        )
        .textContent =
          employees.length;


      document
        .getElementById(
          "onlineCount"
        )
        .textContent =
          online;


      document
        .getElementById(
          "delayedCount"
        )
        .textContent =
          delayed;


      document
        .getElementById(
          "offlineCount"
        )
        .textContent =
          offline;

    }


    /* =====================================================
       EMPLOYEE CARDS
    ===================================================== */

    function renderEmployeeCards(
      employees
    ) {

      const container =
        document.getElementById(
          "employees"
        );


      if (
        !employees.length
      ) {

        container.innerHTML =
          `
          <div class="empty">
            👥 Hozircha xodimlar topilmadi.
          </div>
          `;

        return;

      }


      /*
        Global cache
      */

      window.employeeCache =
        {};


      employees.forEach(
        function(employee) {

          window.employeeCache[
            employee.employee_id
          ] =
            employee;

        }
      );


      container.innerHTML =
        employees
          .map(
            function(employee) {

              const working =
                isWorking(
                  employee
                );


              const gpsStatus =
                getGpsStatus(
                  employee
                );


              let statusClass =
                "status-none";


              if (
                gpsStatus === "online"
              ) {

                statusClass =
                  "status-online";

              } else if (
                gpsStatus === "delayed"
              ) {

                statusClass =
                  "status-delayed";

              } else if (
                gpsStatus === "offline"
              ) {

                statusClass =
                  "status-offline";

              }


              const lat =
                employee.latitude;


              const lng =
                employee.longitude;


              const hasGps =
                lat !== null &&
                lat !== undefined &&
                lng !== null &&
                lng !== undefined;


              const googleButton =
                hasGps
                  ? `
                    <button
                      type="button"
                      class="btn-google"
                    >
                      🌐 Google Maps
                    </button>
                    `
                  : `
                    <button
                      type="button"
                      class="btn-google"
                      disabled
                      style="
                        opacity:.5;
                        cursor:not-allowed;
                      "
                    >
                      🌐 Google Maps
                    </button>
                    `;


              return `

                <div
                  class="employee-card"
                  data-employee-id="${
                    employee.employee_id
                  }"
                >

                  <div class="employee-top">

                    <div>

                      <div class="employee-name">
                        ${escapeHtml(
                          employee.full_name
                        )}
                      </div>

                      <div class="employee-branch">
                        🏢 ${
                          escapeHtml(
                            employee.branch_name ||
                            "Filial ko'rsatilmagan"
                          )
                        }
                      </div>

                    </div>


                    <div
                      class="
                        status
                        ${statusClass}
                      "
                    >
                      ${getGpsStatusText(
                        employee
                      )}
                    </div>

                  </div>


                  <div class="info-row">

                    <span class="info-label">
                      💼 Ish holati
                    </span>

                    <span
                      class="
                        info-value
                        ${
                          working
                            ? "working"
                            : "stopped"
                        }
                      "
                    >
                      ${
                        working
                          ? "🟢 Ishlayapti"
                          : "🔴 Ishlamayapti"
                      }
                    </span>

                  </div>


                  <div class="info-row">

                    <span class="info-label">
                      🕐 Ish boshlanishi
                    </span>

                    <span class="info-value">
                      ${
                        formatDate(
                          employee.work_started_at
                        )
                      }
                    </span>

                  </div>


                  <div class="info-row">

                    <span class="info-label">
                      ⏱ Ish vaqti
                    </span>

                    <span
                      class="
                        info-value
                        live-duration
                      "
                    >
                      ${
                        formatDuration(
                          getWorkSeconds(
                            employee
                          )
                        )
                      }
                    </span>

                  </div>


                  <div class="info-row">

                    <span class="info-label">
                      📍 GPS
                    </span>

                    <span class="info-value">

                      ${
                        hasGps
                          ? Number(
                              lat
                            ).toFixed(
                              6
                            ) +
                            ", " +
                            Number(
                              lng
                            ).toFixed(
                              6
                            )
                          : "GPS yo'q"
                      }

                    </span>

                  </div>


                  <div class="info-row">

                    <span class="info-label">
                      🕒 Oxirgi GPS
                    </span>

                    <span class="info-value">

                      ${
                        formatDate(
                          employee.last_location_at
                        )
                      }

                    </span>

                  </div>


                  <div class="info-row">

                    <span class="info-label">
                      📡 Signal
                    </span>

                    <span class="info-value">

                      ${
                        getGpsAgeText(
                          employee
                        )
                      }

                    </span>

                  </div>


                  <div class="buttons">

                    <button
                      type="button"
                      class="btn-map"
                    >
                      📍 Xaritada
                    </button>


                    <button
                      type="button"
                      class="btn-route"
                    >
                      🗺️ Marshrut
                    </button>


                    ${googleButton}

                  </div>

                </div>

              `;

            }
          )
          .join(
            ""
          );


      /*
        Button eventlari
      */

      employees.forEach(
        function(employee) {

          const card =
            container.querySelector(
              `[data-employee-id="${employee.employee_id}"]`
            );


          if (!card) {
            return;
          }


          /*
            Xaritada ko'rsatish
          */

          const mapButton =
            card.querySelector(
              ".btn-map"
            );


          if (mapButton) {

            mapButton.addEventListener(
              "click",
              function() {

                showEmployeeOnMap(
                  employee
                );

              }
            );

          }


          /*
            Marshrut
          */

          const routeButton =
            card.querySelector(
              ".btn-route"
            );


          if (routeButton) {

            routeButton.addEventListener(
              "click",
              function() {

                showEmployeeRoute(
                  employee
                );

              }
            );

          }


          /*
            Google Maps
          */

          const googleButton =
            card.querySelector(
              ".btn-google"
            );


          if (
            googleButton &&
            hasValidCoordinates(
              employee
            )
          ) {

            googleButton.addEventListener(
              "click",
              function() {

                const lat =
                  Number(
                    employee.latitude
                  );

                const lng =
                  Number(
                    employee.longitude
                  );


                window.open(
                  "https://www.google.com/maps?q=" +
                  lat +
                  "," +
                  lng,

                  "_blank"
                );

              }
            );

          }

        }
      );

    }


    /* =====================================================
       COORDINATE CHECK
    ===================================================== */

    function hasValidCoordinates(
      employee
    ) {

      const lat =
        Number(
          employee.latitude
        );

      const lng =
        Number(
          employee.longitude
        );


      return (
        Number.isFinite(lat) &&
        Number.isFinite(lng)
      );

    }


    /* =====================================================
       ERROR
    ===================================================== */

    function showError(
      message
    ) {

      const element =
        document.getElementById(
          "error"
        );


      element.textContent =
        message;


      element.style.display =
        "block";

    }


    function hideError() {

      const element =
        document.getElementById(
          "error"
        );


      element.textContent =
        "";


      element.style.display =
        "none";

    }


    /* =====================================================
       LOADING
    ===================================================== */

    function setLoadingStatus() {

      document
        .getElementById(
          "mapStatus"
        )
        .textContent =
          "🔄 Ma'lumot yangilanmoqda...";

    }


    /* =====================================================
       LOAD EMPLOYEES
    ===================================================== */

    async function loadEmployees() {

      try {

        setLoadingStatus();

        hideError();


        const controller =
          new AbortController();


        const timeout =
          setTimeout(
            function() {

              controller.abort();

            },
            10000
          );


        const response =
          await fetch(
            ENDPOINT +
            "?view=data",
            {
              method:
                "GET",

              headers: {
                "Accept":
                  "application/json"
              },

              signal:
                controller.signal
            }
          );


        clearTimeout(
          timeout
        );


        if (
          !response.ok
        ) {

          throw new Error(
            "HTTP " +
            response.status
          );

        }


        const employees =
          await response.json();


        if (
          !Array.isArray(
            employees
          )
        ) {

          throw new Error(
            "Server noto'g'ri ma'lumot qaytardi."
          );

        }


        console.log(
          "EMPLOYEES:",
          employees
        );


        /*
          Markerlar
        */

        const currentIds =
          new Set();


        employees.forEach(
          function(employee) {

            currentIds.add(
              Number(
                employee.employee_id
              )
            );


            updateMarker(
              employee
            );

          }
        );


        removeOldMarkers(
          currentIds
        );


        /*
          Statistikalar
        */

        updateStatistics(
          employees
        );


        /*
          Kartalar
        */

        renderEmployeeCards(
          employees
        );


        /*
          Map status
        */

        document
          .getElementById(
            "mapStatus"
          )
          .textContent =
            "🟢 Yangilandi: " +
            new Date()
              .toLocaleTimeString(
                "uz-UZ"
              );


      } catch (
        error
      ) {

        console.error(
          "LOAD EMPLOYEES ERROR:",
          error
        );


        if (
          error.name ===
          "AbortError"
        ) {

          showError(
            "Serverga ulanish vaqti tugadi. Internet yoki Supabase holatini tekshiring."
          );

        } else {

          showError(
            "Xodimlar ma'lumotini olishda xato:\n" +
            String(error)
          );

        }


        document
          .getElementById(
            "mapStatus"
          )
          .textContent =
            "❌ Xato";

      }

    }


    /* =====================================================
       AUTO REFRESH
    ===================================================== */

    function startAutoRefresh() {

      setInterval(
        function() {

          loadEmployees();

        },
        30000
      );

    }


    /* =====================================================
       START APPLICATION
    ===================================================== */

    async function startApplication() {

      try {

        initMap();

        startWorkTimer();

        await loadEmployees();

        startAutoRefresh();


      } catch (
        error
      ) {

        console.error(
          "APPLICATION ERROR:",
          error
        );


        showError(
          "Ilovani ishga tushirishda xato:\n" +
          String(error)
        );

      }

    }


    /* =====================================================
       START
    ===================================================== */

    startApplication();

  </script>

</body>
