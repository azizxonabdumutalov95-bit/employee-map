<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  />

  <title>Xodimlar kartasi</title>

  <!-- Leaflet -->
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  />

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      color: #1f2937;
    }

    body {
      overflow-x: hidden;
    }

    .header {
      background: linear-gradient(135deg, #0f172a, #1e3a8a);
      color: white;
      padding: 18px 15px;
      text-align: center;
    }

    .header h1 {
      margin: 0;
      font-size: 24px;
    }

    .header p {
      margin: 6px 0 0;
      opacity: 0.85;
      font-size: 13px;
    }

    .container {
      width: 100%;
      max-width: 1200px;
      margin: 0 auto;
      padding: 12px;
    }

    /* STATISTICS */

    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-bottom: 12px;
    }

    .stat {
      background: white;
      border-radius: 14px;
      padding: 14px 10px;
      text-align: center;
      box-shadow: 0 3px 12px rgba(0, 0, 0, 0.07);
    }

    .stat-number {
      font-size: 25px;
      font-weight: bold;
      color: #1d4ed8;
    }

    .stat-label {
      font-size: 12px;
      color: #64748b;
      margin-top: 4px;
    }

    /* MAP */

    .map-wrapper {
      background: white;
      border-radius: 16px;
      padding: 8px;
      box-shadow: 0 3px 15px rgba(0, 0, 0, 0.08);
      margin-bottom: 15px;
    }

    #map {
      width: 100%;
      height: 500px;
      border-radius: 12px;
      overflow: hidden;
    }

    .map-status {
      padding: 8px 5px 2px;
      font-size: 12px;
      color: #64748b;
      text-align: center;
    }

    /* EMPLOYEES */

    .employees-title {
      font-size: 19px;
      font-weight: bold;
      margin: 10px 2px;
    }

    .employees {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
    }

    .employee-card {
      background: white;
      border-radius: 15px;
      padding: 15px;
      box-shadow: 0 3px 12px rgba(0, 0, 0, 0.07);
      border-left: 5px solid #94a3b8;
    }

    .employee-card.working {
      border-left-color: #16a34a;
    }

    .employee-name {
      font-size: 17px;
      font-weight: bold;
      margin-bottom: 8px;
    }

    .row {
      font-size: 13px;
      margin: 5px 0;
      color: #475569;
    }

    .status {
      display: inline-block;
      padding: 5px 9px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: bold;
    }

    .status-working {
      background: #dcfce7;
      color: #15803d;
    }

    .status-not-working {
      background: #f1f5f9;
      color: #64748b;
    }

    .buttons {
      display: flex;
      gap: 7px;
      margin-top: 10px;
      flex-wrap: wrap;
    }

    button,
    .map-link {
      border: none;
      border-radius: 9px;
      padding: 9px 12px;
      font-size: 13px;
      cursor: pointer;
      text-decoration: none;
      display: inline-block;
    }

    .btn-map {
      background: #2563eb;
      color: white;
    }

    .btn-google {
      background: #f1f5f9;
      color: #334155;
    }

    .btn-map:hover,
    .btn-google:hover {
      opacity: 0.9;
    }

    /* LEAFLET */

    .leaflet-container {
      font-family: Arial, sans-serif;
      background: #e5e7eb;
    }

    .leaflet-control-zoom a {
      width: 40px !important;
      height: 40px !important;
      line-height: 40px !important;
      font-size: 20px !important;
    }

    .employee-marker {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      border: 3px solid white;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.35);
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 16px;
      font-weight: bold;
    }

    .marker-working {
      background: #16a34a;
    }

    .marker-not-working {
      background: #64748b;
    }

    .popup-title {
      font-size: 16px;
      font-weight: bold;
      margin-bottom: 6px;
    }

    .popup-row {
      font-size: 12px;
      margin: 4px 0;
    }

    .popup-button {
      display: inline-block;
      margin-top: 8px;
      padding: 7px 10px;
      background: #2563eb;
      color: white !important;
      border-radius: 7px;
      text-decoration: none;
      font-size: 12px;
    }

    .loading {
      text-align: center;
      padding: 30px;
      color: #64748b;
    }

    .error {
      background: #fee2e2;
      color: #991b1b;
      padding: 12px;
      border-radius: 10px;
      margin-bottom: 12px;
      font-size: 13px;
    }

    @media (max-width: 700px) {
      .stats {
        grid-template-columns: repeat(3, 1fr);
      }

      .stat {
        padding: 11px 5px;
      }

      .stat-number {
        font-size: 20px;
      }

      .stat-label {
        font-size: 10px;
      }

      #map {
        height: 430px;
      }

      .employees {
        grid-template-columns: 1fr;
      }

      .employee-name {
        font-size: 16px;
      }

      .container {
        padding: 8px;
      }
    }

    @media (max-width: 400px) {
      #map {
        height: 400px;
      }
    }
  </style>
</head>

<body>

  <div class="header">
    <h1>🗺 Xodimlar kartasi</h1>
    <p>Real vaqtga yaqin GPS monitoring</p>
  </div>

  <div class="container">

    <div id="errorBox"></div>

    <!-- STATISTICS -->
    <div class="stats">
      <div class="stat">
        <div class="stat-number" id="totalEmployees">0</div>
        <div class="stat-label">Jami xodim</div>
      </div>

      <div class="stat">
        <div class="stat-number" id="workingEmployees">0</div>
        <div class="stat-label">Ishlayapti</div>
      </div>

      <div class="stat">
        <div class="stat-number" id="gpsEmployees">0</div>
        <div class="stat-label">GPS mavjud</div>
      </div>
    </div>

    <!-- MAP -->
    <div class="map-wrapper">

      <div id="map"></div>

      <div class="map-status" id="mapStatus">
        Ma'lumotlar yuklanmoqda...
      </div>

    </div>

    <!-- EMPLOYEES -->
    <div class="employees-title">
      👥 Xodimlar
    </div>

    <div id="employees" class="employees">
      <div class="loading">
        Xodimlar yuklanmoqda...
      </div>
    </div>

  </div>

  <!-- LEAFLET JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>

    /*
      ==========================================
      SUPABASE EDGE FUNCTION
      ==========================================
    */

    const ENDPOINT =
      "https://qyvglgcjsqifyubmpah2.supabase.co/functions/v1/smart-endpoint";


    /*
      ==========================================
      GLOBAL VARIABLES
      ==========================================
    */

    let map = null;

    // employee_id -> Leaflet marker
    const markers = new Map();

    // employee_id -> employee data
    const employeesCache = new Map();

    let firstMapLoad = true;

    let lastEmployeeIds = new Set();


    /*
      ==========================================
      MAP INITIALIZATION
      ==========================================
    */

    function initMap() {

      map = L.map("map", {

        center: [40.5124, 69.8783],

        zoom: 12,

        zoomControl: true,

        dragging: true,

        touchZoom: true,

        scrollWheelZoom: true,

        doubleClickZoom: true,

        boxZoom: true,

        keyboard: true

      });


      /*
        OpenStreetMap
      */

      L.tileLayer(
        "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
        {
          maxZoom: 19,

          attribution:
            '&copy; <a href="https://www.openstreetmap.org/">OpenStreetMap</a>'
        }
      ).addTo(map);


      /*
        Telegram/WebView ichida
        karta o'lchamini qayta hisoblash
      */

      setTimeout(function () {

        if (map) {
          map.invalidateSize(true);
        }

      }, 500);


      setTimeout(function () {

        if (map) {
          map.invalidateSize(true);
        }

      }, 1500);

    }


    /*
      ==========================================
      CREATE MARKER ICON
      ==========================================
    */

    function createEmployeeIcon(employee) {

      const working = isWorking(employee);

      const html =
        '<div class="employee-marker ' +
        (working
          ? "marker-working"
          : "marker-not-working") +
        '">' +
        "👤" +
        "</div>";


      return L.divIcon({

        html: html,

        className: "",

        iconSize: [34, 34],

        iconAnchor: [17, 17],

        popupAnchor: [0, -18]

      });

    }


    /*
      ==========================================
      CHECK WORK STATUS
      ==========================================
    */

    function isWorking(employee) {

      return (
        employee.work_started_at &&
        !employee.work_ended_at
      );

    }


    /*
      ==========================================
      DATE FORMAT
      ==========================================
    */

    function formatDate(value) {

      if (!value) {
        return "—";
      }

      try {

        const date = new Date(value);

        if (isNaN(date.getTime())) {
          return "—";
        }

        return date.toLocaleString("uz-UZ");

      } catch (e) {

        return "—";

      }

    }


    /*
      ==========================================
      POPUP
      ==========================================
    */

    function createPopup(employee) {

      const working = isWorking(employee);

      const statusText =
        working
          ? "🟢 Ishlayapti"
          : "⚪ Ishlamayapti";


      let gpsText = "GPS mavjud emas";

      if (
        employee.latitude !== null &&
        employee.latitude !== undefined &&
        employee.longitude !== null &&
        employee.longitude !== undefined
      ) {

        gpsText =
          Number(employee.latitude).toFixed(6) +
          ", " +
          Number(employee.longitude).toFixed(6);

      }


      let googleButton = "";

      if (
        employee.latitude !== null &&
        employee.latitude !== undefined &&
        employee.longitude !== null &&
        employee.longitude !== undefined
      ) {

        const lat = Number(employee.latitude);

        const lon = Number(employee.longitude);

        googleButton =
          '<a class="popup-button" target="_blank" href="' +
          "https://www.google.com/maps?q=" +
          lat +
          "," +
          lon +
          '">' +
          "📍 Google Maps" +
          "</a>";

      }


      return (

        '<div>' +

          '<div class="popup-title">' +
            escapeHtml(employee.full_name || "Noma'lum") +
          "</div>" +

          '<div class="popup-row">' +
            "🏢 Filial: " +
            escapeHtml(employee.branch_name || "—") +
          "</div>" +

          '<div class="popup-row">' +
            "📊 Holat: " +
            statusText +
          "</div>" +

          '<div class="popup-row">' +
            "🕐 Ish boshlagan: " +
            formatDate(employee.work_started_at) +
          "</div>" +

          '<div class="popup-row">' +
            "📍 GPS: " +
            gpsText +
          "</div>" +

          '<div class="popup-row">' +
            "🕒 Oxirgi GPS: " +
            formatDate(employee.last_location_at) +
          "</div>" +

          googleButton +

        "</div>"

      );

    }


    /*
      ==========================================
      ESCAPE HTML
      ==========================================
    */

    function escapeHtml(value) {

      return String(value)

        .replace(/&/g, "&amp;")

        .replace(/</g, "&lt;")

        .replace(/>/g, "&gt;")

        .replace(/"/g, "&quot;")

        .replace(/'/g, "&#039;");

    }


    /*
      ==========================================
      UPDATE MARKER
      ==========================================
    */

    function updateMarker(employee) {

      const id = String(employee.employee_id);


      if (
        employee.latitude === null ||
        employee.longitude === null ||
        employee.latitude === undefined ||
        employee.longitude === undefined
      ) {

        /*
          GPS yo'q bo'lsa marker kerak emas
        */

        if (markers.has(id)) {

          map.removeLayer(markers.get(id));

          markers.delete(id);

        }

        return;

      }


      const lat = Number(employee.latitude);

      const lon = Number(employee.longitude);


      if (
        !Number.isFinite(lat) ||
        !Number.isFinite(lon)
      ) {

        return;

      }


      /*
        MARKER AVVAL BOR BO'LSA
        uni o'chirmaymiz.
      */

      if (markers.has(id)) {

        const marker = markers.get(id);


        /*
          Faqat koordinatasini yangilaymiz
        */

        marker.setLatLng([lat, lon]);


        /*
          Ish holati o'zgargan bo'lsa
          iconni yangilaymiz
        */

        marker.setIcon(
          createEmployeeIcon(employee)
        );


        /*
          Popupni yangilaymiz
        */

        marker.setPopupContent(
          createPopup(employee)
        );


      } else {

        /*
          Yangi marker
        */

        const marker = L.marker(
          [lat, lon],
          {
            icon: createEmployeeIcon(employee)
          }
        );


        marker.bindPopup(
          createPopup(employee)
        );


        marker.addTo(map);


        markers.set(id, marker);

      }

    }


    /*
      ==========================================
      REMOVE OLD MARKERS
      ==========================================
    */

    function removeOldMarkers(currentIds) {

      markers.forEach(function(marker, id) {

        if (!currentIds.has(id)) {

          map.removeLayer(marker);

          markers.delete(id);

        }

      });

    }


    /*
      ==========================================
      LOAD EMPLOYEES
      ==========================================
    */

    async function loadEmployees() {

      try {

        const response = await fetch(
          ENDPOINT +
          "?view=data&t=" +
          Date.now(),
          {
            cache: "no-store"
          }
        );


        if (!response.ok) {

          throw new Error(
            "Server xatosi: " +
            response.status
          );

        }


        const data = await response.json();


        /*
          API response array bo'lishi kerak
        */

        let employees = [];


        if (Array.isArray(data)) {

          employees = data;

        } else if (Array.isArray(data.employees)) {

          employees = data.employees;

        } else if (Array.isArray(data.data)) {

          employees = data.data;

        }


        /*
          CACHE
        */

        employeesCache.clear();


        employees.forEach(function(employee) {

          employeesCache.set(
            String(employee.employee_id),
            employee
          );

        });


        /*
          STATISTICS
        */

        updateStatistics(employees);


        /*
          CARDS
        */

        renderEmployeeCards(employees);


        /*
          CURRENT IDS
        */

        const currentIds = new Set(

          employees.map(function(employee) {

            return String(employee.employee_id);

          })

        );


        /*
          Eski markerlarni olib tashlash
        */

        removeOldMarkers(currentIds);


        /*
          Markerlarni update qilish
        */

        employees.forEach(function(employee) {

          updateMarker(employee);

        });


        /*
          MUHIM:
          MAP FAQAT BIRINCHI MARTA
          markerlarga moslashtiriladi.
          
          Har 30 sekundda mapni
          qayta markazlashtirmaymiz.
        */

        if (
          firstMapLoad &&
          markers.size > 0
        ) {

          fitMapToMarkers();

          firstMapLoad = false;

        }


        /*
          Agar xodimlar soni o'zgargan bo'lsa,
          yangi markerlarni ko'rsatish mumkin.
          
          Lekin foydalanuvchining zoom/pan
          holatini buzmaymiz.
        */

        lastEmployeeIds = currentIds;


        /*
          STATUS
        */

        document.getElementById("mapStatus").textContent =
          "🔄 Oxirgi yangilanish: " +
          new Date().toLocaleTimeString("uz-UZ");


        /*
          Leaflet o'lchamini tekshirish
        */

        setTimeout(function() {

          if (map) {
            map.invalidateSize(true);
          }

        }, 100);


        hideError();


      } catch (error) {

        console.error(error);

        showError(
          "❌ Ma'lumotlarni olishda xato: " +
          error.message
        );

      }

    }


    /*
      ==========================================
      FIT MAP
      ==========================================
    */

    function fitMapToMarkers() {

      if (!map || markers.size === 0) {
        return;
      }


      const group = L.featureGroup(
        Array.from(markers.values())
      );


      const bounds = group.getBounds();


      if (bounds.isValid()) {

        map.fitBounds(
          bounds,
          {
            padding: [40, 40],

            maxZoom: 14,

            animate: true

          }
        );

      }

    }


    /*
      ==========================================
      STATISTICS
      ==========================================
    */

    function updateStatistics(employees) {

      let working = 0;

      let gps = 0;


      employees.forEach(function(employee) {

        if (isWorking(employee)) {

          working++;

        }


        if (
          employee.latitude !== null &&
          employee.latitude !== undefined &&
          employee.longitude !== null &&
          employee.longitude !== undefined
        ) {

          gps++;

        }

      });


      document.getElementById(
        "totalEmployees"
      ).textContent = employees.length;


      document.getElementById(
        "workingEmployees"
      ).textContent = working;


      document.getElementById(
        "gpsEmployees"
      ).textContent = gps;

    }


    /*
      ==========================================
      EMPLOYEE CARDS
      ==========================================
    */

    function renderEmployeeCards(employees) {

      const container =
        document.getElementById("employees");


      if (!employees.length) {

        container.innerHTML =
          '<div class="loading">' +
          "Xodimlar topilmadi" +
          "</div>";

        return;

      }


      container.innerHTML = "";


      employees.forEach(function(employee) {

        const working =
          isWorking(employee);


        const hasGps =
          employee.latitude !== null &&
          employee.latitude !== undefined &&
          employee.longitude !== null &&
          employee.longitude !== undefined;


        const card =
          document.createElement("div");


        card.className =
          "employee-card" +
          (working ? " working" : "");


        const status =
          working

            ? '<span class="status status-working">🟢 Ishlayapti</span>'

            : '<span class="status status-not-working">⚪ Ishlamayapti</span>';


        let gpsText = "GPS mavjud emas";


        if (hasGps) {

          gpsText =
            Number(employee.latitude).toFixed(6) +
            ", " +
            Number(employee.longitude).toFixed(6);

        }


        let googleButton = "";


        if (hasGps) {

          googleButton =
            '<a class="map-link btn-google" target="_blank" href="' +
            "https://www.google.com/maps?q=" +
            Number(employee.latitude) +
            "," +
            Number(employee.longitude) +
            '">' +
            "📍 Google Maps" +
            "</a>";

        }


        card.innerHTML =

          '<div class="employee-name">' +
            escapeHtml(
              employee.full_name || "Noma'lum"
            ) +
          "</div>" +

          '<div class="row">' +
            "🏢 " +
            escapeHtml(
              employee.branch_name || "Filial yo'q"
            ) +
          "</div>" +

          '<div class="row">' +
            status +
          "</div>" +

          '<div class="row">' +
            "🕐 Ish boshlagan: " +
            formatDate(employee.work_started_at) +
          "</div>" +

          '<div class="row">' +
            "📍 GPS: " +
            gpsText +
          "</div>" +

          '<div class="row">' +
            "🕒 Oxirgi GPS: " +
            formatDate(employee.last_location_at) +
          "</div>" +

          '<div class="buttons">' +

            '<button type="button" class="btn-map">' +
              "📍 Xaritada ko‘rsatish" +
            "</button>" +

            googleButton +

          "</div>";


        /*
          MAP BUTTON
        */

        const mapButton =
          card.querySelector(".btn-map");


        mapButton.addEventListener(
          "click",
          function() {

            showEmployeeOnMap(employee);

          }
        );


        container.appendChild(card);

      });

    }


    /*
      ==========================================
      SHOW EMPLOYEE ON MAP
      ==========================================
    */

    function showEmployeeOnMap(employee) {

      if (
        employee.latitude === null ||
        employee.longitude === null ||
        employee.latitude === undefined ||
        employee.longitude === undefined
      ) {

        alert(
          "Bu xodimda GPS ma'lumoti mavjud emas."
        );

        return;

      }


      const lat =
        Number(employee.latitude);


      const lon =
        Number(employee.longitude);


      if (
        !Number.isFinite(lat) ||
        !Number.isFinite(lon)
      ) {

        alert(
          "GPS koordinatasi noto'g'ri."
        );

        return;

      }


      /*
        Mapni xodim joylashuviga olib boramiz.
      */

      map.flyTo(
        [lat, lon],
        16,
        {
          duration: 0.8
        }
      );


      /*
        Marker popup
        ochiladi
      */

      const id =
        String(employee.employee_id);


      if (markers.has(id)) {

        const marker =
          markers.get(id);


        setTimeout(function() {

          marker.openPopup();

        }, 500);

      }

    }


    /*
      ==========================================
      ERROR
      ==========================================
    */

    function showError(message) {

      const box =
        document.getElementById("errorBox");


      box.innerHTML =
        '<div class="error">' +
        escapeHtml(message) +
        "</div>";

    }


    function hideError() {

      document.getElementById(
        "errorBox"
      ).innerHTML = "";

    }


    /*
      ==========================================
      START
      ==========================================
    */

    document.addEventListener(
      "DOMContentLoaded",
      function() {

        /*
          Mapni faqat bir marta yaratamiz
        */

        initMap();


        /*
          Birinchi ma'lumot
        */

        loadEmployees();


        /*
          HAR 30 SEKUNDDA
          faqat ma'lumot va markerlar update.
          
          MAP VIEW O'ZGARMAYDI.
        */

        setInterval(
          loadEmployees,
          30000
        );

      }
    );

  </script>

</body>
</html>
