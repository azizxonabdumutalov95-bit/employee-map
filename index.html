<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  >

  <title>Xodimlar kartasi</title>

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  >

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      color: #1f2937;
    }

    body {
      overflow-x: hidden;
    }

    .header {
      background: linear-gradient(135deg, #0f172a, #1e3a8a);
      color: white;
      padding: 18px 15px;
      text-align: center;
    }

    .header h1 {
      margin: 0;
      font-size: 24px;
    }

    .header p {
      margin: 6px 0 0;
      opacity: 0.85;
      font-size: 13px;
    }

    .container {
      width: 100%;
      max-width: 1200px;
      margin: 0 auto;
      padding: 12px;
    }

    /* =========================
       ERROR
    ========================= */

    .error {
      background: #fee2e2;
      color: #991b1b;
      padding: 12px;
      border-radius: 10px;
      margin-bottom: 12px;
      font-size: 13px;
      line-height: 1.5;
      word-break: break-word;
    }

    .success {
      background: #dcfce7;
      color: #166534;
      padding: 10px;
      border-radius: 10px;
      margin-bottom: 12px;
      font-size: 13px;
    }

    /* =========================
       STATISTICS
    ========================= */

    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-bottom: 12px;
    }

    .stat {
      background: white;
      border-radius: 14px;
      padding: 14px 10px;
      text-align: center;
      box-shadow: 0 3px 12px rgba(0, 0, 0, 0.07);
    }

    .stat-number {
      font-size: 25px;
      font-weight: bold;
      color: #1d4ed8;
    }

    .stat-label {
      font-size: 12px;
      color: #64748b;
      margin-top: 4px;
    }

    /* =========================
       MAP
    ========================= */

    .map-wrapper {
      background: white;
      border-radius: 16px;
      padding: 8px;
      box-shadow: 0 3px 15px rgba(0, 0, 0, 0.08);
      margin-bottom: 15px;
    }

    #map {
      width: 100%;
      height: 500px;
      border-radius: 12px;
      overflow: hidden;
    }

    .map-status {
      padding: 10px 5px 3px;
      font-size: 12px;
      color: #64748b;
      text-align: center;
    }

    /* =========================
       EMPLOYEES
    ========================= */

    .employees-title {
      font-size: 19px;
      font-weight: bold;
      margin: 10px 2px;
    }

    .employees {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
    }

    .employee-card {
      background: white;
      border-radius: 15px;
      padding: 15px;
      box-shadow: 0 3px 12px rgba(0, 0, 0, 0.07);
      border-left: 5px solid #94a3b8;
    }

    .employee-card.working {
      border-left-color: #16a34a;
    }

    .employee-name {
      font-size: 17px;
      font-weight: bold;
      margin-bottom: 8px;
    }

    .row {
      font-size: 13px;
      margin: 6px 0;
      color: #475569;
      line-height: 1.4;
    }

    .status {
      display: inline-block;
      padding: 5px 9px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: bold;
    }

    .status-working {
      background: #dcfce7;
      color: #15803d;
    }

    .status-not-working {
      background: #f1f5f9;
      color: #64748b;
    }

    .buttons {
      display: flex;
      gap: 7px;
      margin-top: 10px;
      flex-wrap: wrap;
    }

    button,
    .map-link {
      border: none;
      border-radius: 9px;
      padding: 9px 12px;
      font-size: 13px;
      cursor: pointer;
      text-decoration: none;
      display: inline-block;
    }

    .btn-map {
      background: #2563eb;
      color: white;
    }

    .btn-google {
      background: #f1f5f9;
      color: #334155;
    }

    .btn-refresh {
      background: #0f766e;
      color: white;
      margin-top: 8px;
    }

    button:hover,
    .map-link:hover {
      opacity: 0.9;
    }

    /* =========================
       LEAFLET
    ========================= */

    .leaflet-container {
      font-family: Arial, sans-serif;
      background: #e5e7eb;
    }

    .leaflet-control-zoom a {
      width: 40px !important;
      height: 40px !important;
      line-height: 40px !important;
      font-size: 20px !important;
    }

    .employee-marker {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      border: 3px solid white;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.35);
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 17px;
      font-weight: bold;
    }

    .marker-working {
      background: #16a34a;
    }

    .marker-not-working {
      background: #64748b;
    }

    .popup-title {
      font-size: 16px;
      font-weight: bold;
      margin-bottom: 6px;
    }

    .popup-row {
      font-size: 12px;
      margin: 5px 0;
      line-height: 1.4;
    }

    .popup-button {
      display: inline-block;
      margin-top: 8px;
      padding: 7px 10px;
      background: #2563eb;
      color: white !important;
      border-radius: 7px;
      text-decoration: none;
      font-size: 12px;
    }

    .loading {
      text-align: center;
      padding: 30px;
      color: #64748b;
      background: white;
      border-radius: 14px;
    }

    .loading-spinner {
      display: inline-block;
      width: 18px;
      height: 18px;
      border: 3px solid #dbeafe;
      border-top-color: #2563eb;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      vertical-align: middle;
      margin-right: 7px;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    .last-update {
      font-size: 11px;
      color: #64748b;
      text-align: center;
      margin-top: 5px;
    }

    @media (max-width: 700px) {
      .stats {
        grid-template-columns: repeat(3, 1fr);
      }

      .stat {
        padding: 11px 5px;
      }

      .stat-number {
        font-size: 20px;
      }

      .stat-label {
        font-size: 10px;
      }

      #map {
        height: 430px;
      }

      .employees {
        grid-template-columns: 1fr;
      }

      .employee-name {
        font-size: 16px;
      }

      .container {
        padding: 8px;
      }
    }

    @media (max-width: 400px) {
      #map {
        height: 400px;
      }
    }
  </style>
</head>

<body>

  <div class="header">
    <h1>🗺 Xodimlar kartasi</h1>
    <p>Real vaqtga yaqin GPS monitoring</p>
  </div>

  <div class="container">

    <div id="errorBox"></div>

    <!-- STATISTICS -->

    <div class="stats">

      <div class="stat">
        <div class="stat-number" id="totalEmployees">0</div>
        <div class="stat-label">Jami xodim</div>
      </div>

      <div class="stat">
        <div class="stat-number" id="workingEmployees">0</div>
        <div class="stat-label">Ishlayapti</div>
      </div>

      <div class="stat">
        <div class="stat-number" id="gpsEmployees">0</div>
        <div class="stat-label">GPS mavjud</div>
      </div>

    </div>

    <!-- MAP -->

    <div class="map-wrapper">

      <div id="map"></div>

      <div class="map-status" id="mapStatus">
        <span class="loading-spinner"></span>
        Ma'lumotlar yuklanmoqda...
      </div>

    </div>

    <!-- EMPLOYEES -->

    <div class="employees-title">
      👥 Xodimlar
    </div>

    <div id="employees">

      <div class="loading">
        <span class="loading-spinner"></span>
        Xodimlar yuklanmoqda...
      </div>

    </div>

  </div>

  <!-- LEAFLET -->

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>

    /*
    =====================================================
    SUPABASE EDGE FUNCTION
    =====================================================
    */

    const ENDPOINT =
      "https://qyvglgcjsqifyubmpahw.supabase.co/functions/v1/smart-endpoint";


    /*
    =====================================================
    GLOBAL VARIABLES
    =====================================================
    */

    let map = null;

    const markers = new Map();

    const employeesCache = new Map();

    let firstMapLoad = true;

    let loading = false;

    let refreshTimer = null;


    /*
    =====================================================
    MAP INITIALIZATION
    =====================================================
    */

    function initMap() {

      map = L.map("map", {

        center: [40.2273, 69.2630],

        zoom: 13,

        zoomControl: true,

        dragging: true,

        touchZoom: true,

        scrollWheelZoom: true,

        doubleClickZoom: true,

        boxZoom: true,

        keyboard: true

      });


      L.tileLayer(
        "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
        {
          maxZoom: 19,

          attribution:
            '&copy; <a href="https://www.openstreetmap.org/">OpenStreetMap</a>'
        }
      ).addTo(map);


      setTimeout(function() {

        if (map) {

          map.invalidateSize(true);

        }

      }, 500);


      setTimeout(function() {

        if (map) {

          map.invalidateSize(true);

        }

      }, 1500);

    }


    /*
    =====================================================
    WORK STATUS
    =====================================================
    */

    function isWorking(employee) {

      return Boolean(
        employee &&
        employee.work_started_at &&
        !employee.work_ended_at
      );

    }


    /*
    =====================================================
    DATE FORMAT
    =====================================================
    */

    function formatDate(value) {

      if (!value) {

        return "—";

      }

      const date = new Date(value);

      if (isNaN(date.getTime())) {

        return "—";

      }

      return date.toLocaleString(
        "uz-UZ",
        {
          dateStyle: "short",
          timeStyle: "medium"
        }
      );

    }


    /*
    =====================================================
    ESCAPE HTML
    =====================================================
    */

    function escapeHtml(value) {

      return String(value ?? "")

        .replace(/&/g, "&amp;")

        .replace(/</g, "&lt;")

        .replace(/>/g, "&gt;")

        .replace(/"/g, "&quot;")

        .replace(/'/g, "&#039;");

    }


    /*
    =====================================================
    CREATE MARKER ICON
    =====================================================
    */

    function createEmployeeIcon(employee) {

      const working = isWorking(employee);

      return L.divIcon({

        html:
          '<div class="employee-marker ' +
          (working
            ? "marker-working"
            : "marker-not-working") +
          '">' +
          "👤" +
          "</div>",

        className: "",

        iconSize: [36, 36],

        iconAnchor: [18, 18],

        popupAnchor: [0, -20]

      });

    }


    /*
    =====================================================
    CREATE POPUP
    =====================================================
    */

    function createPopup(employee) {

      const working = isWorking(employee);

      const statusText = working
        ? "🟢 Ishlayapti"
        : "⚪ Ishlamayapti";


      let gpsText = "GPS mavjud emas";

      const hasGps =
        employee.latitude !== null &&
        employee.latitude !== undefined &&
        employee.longitude !== null &&
        employee.longitude !== undefined;


      if (hasGps) {

        gpsText =
          Number(employee.latitude).toFixed(6) +
          ", " +
          Number(employee.longitude).toFixed(6);

      }


      let googleButton = "";


      if (hasGps) {

        const lat = Number(employee.latitude);

        const lon = Number(employee.longitude);


        if (
          Number.isFinite(lat) &&
          Number.isFinite(lon)
        ) {

          googleButton =
            '<a class="popup-button" ' +
            'target="_blank" ' +
            'rel="noopener" ' +
            'href="https://www.google.com/maps?q=' +
            lat +
            ',' +
            lon +
            '">' +
            "📍 Google Maps" +
            "</a>";

        }

      }


      return (

        "<div>" +

          '<div class="popup-title">' +
            escapeHtml(
              employee.full_name || "Noma'lum"
            ) +
          "</div>" +

          '<div class="popup-row">' +
            "🏢 Filial: " +
            escapeHtml(
              employee.branch_name || "—"
            ) +
          "</div>" +

          '<div class="popup-row">' +
            "📊 Holat: " +
            statusText +
          "</div>" +

          '<div class="popup-row">' +
            "🕐 Ish boshlagan: " +
            formatDate(employee.work_started_at) +
          "</div>" +

          '<div class="popup-row">' +
            "📍 GPS: " +
            gpsText +
          "</div>" +

          '<div class="popup-row">' +
            "🕒 Oxirgi GPS: " +
            formatDate(employee.last_location_at) +
          "</div>" +

          googleButton +

        "</div>"

      );

    }


    /*
    =====================================================
    UPDATE MARKER
    =====================================================
    */

    function updateMarker(employee) {

      if (!map) {

        return;

      }


      const id =
        String(employee.employee_id);


      const lat =
        Number(employee.latitude);


      const lon =
        Number(employee.longitude);


      const validGps =
        Number.isFinite(lat) &&
        Number.isFinite(lon) &&
        lat >= -90 &&
        lat <= 90 &&
        lon >= -180 &&
        lon <= 180;


      /*
      GPS YO'Q
      */

      if (!validGps) {

        if (markers.has(id)) {

          map.removeLayer(
            markers.get(id)
          );

          markers.delete(id);

        }

        return;

      }


      /*
      MARKER BOR
      */

      if (markers.has(id)) {

        const marker =
          markers.get(id);


        marker.setLatLng([
          lat,
          lon
        ]);


        marker.setIcon(
          createEmployeeIcon(employee)
        );


        marker.setPopupContent(
          createPopup(employee)
        );


        return;

      }


      /*
      YANGI MARKER
      */

      const marker =
        L.marker(
          [lat, lon],
          {
            icon:
              createEmployeeIcon(employee)
          }
        );


      marker.bindPopup(
        createPopup(employee)
      );


      marker.addTo(map);


      markers.set(
        id,
        marker
      );

    }


    /*
    =====================================================
    REMOVE OLD MARKERS
    =====================================================
    */

    function removeOldMarkers(currentIds) {

      if (!map) {

        return;

      }


      markers.forEach(
        function(marker, id) {

          if (!currentIds.has(id)) {

            map.removeLayer(marker);

            markers.delete(id);

          }

        }
      );

    }


    /*
    =====================================================
    FIT MAP ONLY FIRST TIME
    =====================================================
    */

    function fitMapToMarkers() {

      if (
        !map ||
        markers.size === 0
      ) {

        return;

      }


      const markerArray =
        Array.from(
          markers.values()
        );


      if (markerArray.length === 1) {

        const position =
          markerArray[0].getLatLng();


        map.setView(
          [
            position.lat,
            position.lng
          ],
          15
        );


        return;

      }


      const group =
        L.featureGroup(
          markerArray
        );


      const bounds =
        group.getBounds();


      if (bounds.isValid()) {

        map.fitBounds(
          bounds,
          {
            padding: [50, 50],

            maxZoom: 15,

            animate: false
          }
        );

      }

    }


    /*
    =====================================================
    STATISTICS
    =====================================================
    */

    function updateStatistics(employees) {

      let working = 0;

      let gps = 0;


      employees.forEach(
        function(employee) {

          if (isWorking(employee)) {

            working++;

          }


          const lat =
            Number(employee.latitude);


          const lon =
            Number(employee.longitude);


          if (
            Number.isFinite(lat) &&
            Number.isFinite(lon)
          ) {

            gps++;

          }

        }
      );


      document.getElementById(
        "totalEmployees"
      ).textContent =
        employees.length;


      document.getElementById(
        "workingEmployees"
      ).textContent =
        working;


      document.getElementById(
        "gpsEmployees"
      ).textContent =
        gps;

    }


    /*
    =====================================================
    EMPLOYEE CARDS
    =====================================================
    */

    function renderEmployeeCards(employees) {

      const container =
        document.getElementById(
          "employees"
        );


      if (!employees.length) {

        container.innerHTML =
          '<div class="loading">' +
          "Xodimlar topilmadi" +
          "</div>";

        return;

      }


      container.innerHTML = "";


      employees.forEach(
        function(employee) {

          const working =
            isWorking(employee);


          const lat =
            Number(employee.latitude);


          const lon =
            Number(employee.longitude);


          const hasGps =
            Number.isFinite(lat) &&
            Number.isFinite(lon);


          const card =
            document.createElement(
              "div"
            );


          card.className =
            "employee-card" +
            (
              working
                ? " working"
                : ""
            );


          const status =
            working

              ? '<span class="status status-working">🟢 Ishlayapti</span>'

              : '<span class="status status-not-working">⚪ Ishlamayapti</span>';


          const gpsText =
            hasGps

              ? lat.toFixed(6) +
                ", " +
                lon.toFixed(6)

              : "GPS mavjud emas";


          let googleButton = "";


          if (hasGps) {

            googleButton =
              '<a ' +
              'class="map-link btn-google" ' +
              'target="_blank" ' +
              'rel="noopener" ' +
              'href="https://www.google.com/maps?q=' +
              lat +
              ',' +
              lon +
              '">' +
              "📍 Google Maps" +
              "</a>";

          }


          card.innerHTML =

            '<div class="employee-name">' +
              escapeHtml(
                employee.full_name ||
                "Noma'lum"
              ) +
            "</div>" +

            '<div class="row">' +
              "🏢 " +
              escapeHtml(
                employee.branch_name ||
                "Filial yo'q"
              ) +
            "</div>" +

            '<div class="row">' +
              status +
            "</div>" +

            '<div class="row">' +
              "🕐 Ish boshlagan: " +
              formatDate(
                employee.work_started_at
              ) +
            "</div>" +

            '<div class="row">' +
              "📍 GPS: " +
              gpsText +
            "</div>" +

            '<div class="row">' +
              "🕒 Oxirgi GPS: " +
              formatDate(
                employee.last_location_at
              ) +
            "</div>" +

            '<div class="buttons">' +

              '<button ' +
              'type="button" ' +
              'class="btn-map">' +
              "📍 Xaritada ko‘rsatish" +
              "</button>" +

              googleButton +

            "</div>";


          const mapButton =
            card.querySelector(
              ".btn-map"
            );


          mapButton.addEventListener(
            "click",
            function() {

              showEmployeeOnMap(
                employee
              );

            }
          );


          container.appendChild(
            card
          );

        }
      );

    }


    /*
    =====================================================
    SHOW EMPLOYEE ON MAP
    =====================================================
    */

    function showEmployeeOnMap(employee) {

      const lat =
        Number(employee.latitude);


      const lon =
        Number(employee.longitude);


      if (
        !Number.isFinite(lat) ||
        !Number.isFinite(lon)
      ) {

        alert(
          "Bu xodimda GPS ma'lumoti mavjud emas."
        );

        return;

      }


      if (!map) {

        return;

      }


      map.flyTo(
        [lat, lon],
        16,
        {
          duration: 0.8
        }
      );


      const id =
        String(
          employee.employee_id
        );


      const marker =
        markers.get(id);


      if (marker) {

        setTimeout(
          function() {

            marker.openPopup();

          },
          800
        );

      }

    }


    /*
    =====================================================
    ERROR
    =====================================================
    */

    function showError(message) {

      const box =
        document.getElementById(
          "errorBox"
        );


      box.innerHTML =
        '<div class="error">' +
        escapeHtml(message) +
        "</div>";

    }


    function hideError() {

      document.getElementById(
        "errorBox"
      ).innerHTML = "";

    }


    /*
    =====================================================
    LOADING STATUS
    =====================================================
    */

    function setLoadingStatus() {

      document.getElementById(
        "mapStatus"
      ).innerHTML =
        '<span class="loading-spinner"></span>' +
        "Ma'lumotlar yuklanmoqda...";

    }


    /*
    =====================================================
    LOAD EMPLOYEES
    =====================================================
    */

    async function loadEmployees() {

      /*
      Bir vaqtning o'zida
      2 ta request yubormaymiz.
      */

      if (loading) {

        return;

      }


      loading = true;


      try {

        setLoadingStatus();


        /*
        ABORT CONTROLLER

        10 sekunddan ko'p
        kutib qolmaydi.
        */

        const controller =
          new AbortController();


        const timeout =
          setTimeout(
            function() {

              controller.abort();

            },
            10000
          );


        const url =
          ENDPOINT +
          "?view=data&t=" +
          Date.now();


        console.log(
          "API request:",
          url
        );


        const response =
          await fetch(
            url,
            {
              method: "GET",

              cache: "no-store",

              headers: {
                "Accept":
                  "application/json"
              },

              signal:
                controller.signal
            }
          );


        clearTimeout(
          timeout
        );


        console.log(
          "API status:",
          response.status
        );


        if (!response.ok) {

          throw new Error(
            "Server xatosi: HTTP " +
            response.status
          );

        }


        const data =
          await response.json();


        console.log(
          "API data:",
          data
        );


        /*
        API ARRAY
        */

        let employees = [];


        if (
          Array.isArray(data)
        ) {

          employees = data;

        }

        else if (
          data &&
          Array.isArray(
            data.employees
          )
        ) {

          employees =
            data.employees;

        }

        else if (
          data &&
          Array.isArray(
            data.data
          )
        ) {

          employees =
            data.data;

        }

        else {

          throw new Error(
            "API noto‘g‘ri formatda ma'lumot qaytardi."
          );

        }


        /*
        CACHE
        */

        employeesCache.clear();


        employees.forEach(
          function(employee) {

            employeesCache.set(
              String(
                employee.employee_id
              ),
              employee
            );

          }
        );


        /*
        STATISTICS
        */

        updateStatistics(
          employees
        );


        /*
        CARDS
        */

        renderEmployeeCards(
          employees
        );


        /*
        CURRENT IDS
        */

        const currentIds =
          new Set(
            employees.map(
              function(employee) {

                return String(
                  employee.employee_id
                );

              }
            )
          );


        /*
        OLD MARKERS
        */

        removeOldMarkers(
          currentIds
        );


        /*
        UPDATE MARKERS
        */

        employees.forEach(
          function(employee) {

            updateMarker(
              employee
            );

          }
        );


        /*
        FIRST LOAD ONLY

        Har 30 sekundda
        mapni markazlashtirmaymiz.
        */

        if (
          firstMapLoad &&
          markers.size > 0
        ) {

          fitMapToMarkers();

          firstMapLoad = false;

        }


        /*
        STATUS
        */

        const now =
          new Date()
            .toLocaleTimeString(
              "uz-UZ"
            );


        document.getElementById(
          "mapStatus"
        ).innerHTML =
          "🟢 Ma'lumotlar yangilandi";


        document.getElementById(
          "mapStatus"
        ).innerHTML +=
          '<div class="last-update">' +
          "Oxirgi yangilanish: " +
          now +
          " • Keyingi yangilanish: 30 sek." +
          "</div>";


        hideError();


        /*
        LEAFLET SIZE
        */

        setTimeout(
          function() {

            if (map) {

              map.invalidateSize(
                true
              );

            }

          },
          100
        );


      }

      catch (error) {

        console.error(
          "LOAD ERROR:",
          error
        );


        let message =
          "Ma'lumotlarni olishda xato.";


        if (
          error &&
          error.name ===
          "AbortError"
        ) {

          message =
            "❌ Serverdan javob 10 sekund ichida kelmadi.";

        }

        else if (
          error &&
          error.message
        ) {

          message =
            "❌ Ma'lumotlarni olishda xato: " +
            error.message;

        }


        showError(
          message
        );


        document.getElementById(
          "mapStatus"
        ).innerHTML =
          "🔴 Ma'lumotlarni yuklashda xato";


      }

      finally {

        loading = false;

      }

    }


    /*
    =====================================================
    START APPLICATION
    =====================================================
    */

    function startApplication() {

      console.log(
        "Employee Map started"
      );


      console.log(
        "Endpoint:",
        ENDPOINT
      );


      /*
      MAP
      */

      initMap();


      /*
      FIRST LOAD
      */

      loadEmployees();


      /*
      EVERY 30 SECONDS
      */

      refreshTimer =
        setInterval(
          function() {

            loadEmployees();

          },
          30000
        );

    }


    /*
    =====================================================
    DOM READY
    =====================================================
    */

    if (
      document.readyState ===
      "loading"
    ) {

      document.addEventListener(
        "DOMContentLoaded",
        startApplication
      );

    }

    else {

      startApplication();

    }

  </script>

</body>
</html>
