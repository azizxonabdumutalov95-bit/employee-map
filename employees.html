```html
<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Ходимлар бошқаруви</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      color: #222;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 20px;
    }

    .top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }

    h1 {
      margin: 0;
    }

    button {
      border: 0;
      border-radius: 8px;
      padding: 10px 14px;
      cursor: pointer;
      font-size: 14px;
    }

    .add-btn {
      background: #198754;
      color: white;
    }

    .form-box {
      display: none;
      background: white;
      padding: 20px;
      border-radius: 12px;
      margin-bottom: 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,.08);
    }

    .form-box.show {
      display: block;
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 12px;
    }

    label {
      display: block;
      font-weight: bold;
      margin-bottom: 5px;
    }

    input,
    select {
      width: 100%;
      padding: 11px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 15px;
    }

    .save-btn {
      background: #0d6efd;
      color: white;
      margin-top: 15px;
    }

    .cancel-btn {
      background: #6c757d;
      color: white;
      margin-top: 15px;
      margin-left: 8px;
    }

    .message {
      margin: 15px 0;
      padding: 12px;
      border-radius: 8px;
      display: none;
    }

    .success {
      background: #d1e7dd;
      color: #0f5132;
    }

    .error {
      background: #f8d7da;
      color: #842029;
    }

    .search-box {
      background: white;
      padding: 15px;
      border-radius: 12px;
      margin-bottom: 15px;
      box-shadow: 0 2px 8px rgba(0,0,0,.08);
    }

    .search-box input {
      max-width: 500px;
    }

    .table-box {
      background: white;
      border-radius: 12px;
      overflow-x: auto;
      box-shadow: 0 2px 8px rgba(0,0,0,.08);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 950px;
    }

    th,
    td {
      padding: 12px;
      border-bottom: 1px solid #eee;
      text-align: left;
    }

    th {
      background: #f1f3f5;
    }

    .loading {
      text-align: center;
      padding: 30px;
    }

    .edit-btn {
      background: #ffc107;
      color: #222;
      margin-right: 5px;
    }

    .delete-btn {
      background: #dc3545;
      color: white;
    }

    .edit-title {
      margin-top: 0;
    }

    @media (max-width: 600px) {
      .container {
        padding: 12px;
      }

      h1 {
        font-size: 22px;
      }
    }
  </style>
</head>

<body>

<div class="container">

  <div class="top">

    <h1>👥 Ходимлар бошқаруви</h1>

    <button
      class="add-btn"
      onclick="openAddForm()"
    >
      ➕ Ходим қўшиш
    </button>

  </div>


  <div
    id="message"
    class="message"
  ></div>


  <!-- FORM -->

  <div
    id="formBox"
    class="form-box"
  >

    <h2
      id="formTitle"
      class="edit-title"
    >
      Янги ходим қўшиш
    </h2>


    <input
      id="editId"
      type="hidden"
    >


    <div class="form-grid">

      <div>

        <label>
          Ф.И.О.
        </label>

        <input
          id="fullName"
          type="text"
          placeholder="Масалан: Алиев Али"
        >

      </div>


      <div>

        <label>
          Telegram ID
        </label>

        <input
          id="telegramId"
          type="number"
          placeholder="Масалан: 123456789"
        >

      </div>


      <div>

        <label>
          Филиал
        </label>

        <select id="branchId">

          <option value="">
            Филиални танланг
          </option>

        </select>

      </div>


      <div>

        <label>
          Роль
        </label>

        <select id="role">

          <option value="employee">
            Employee
          </option>

          <option value="admin">
            Admin
          </option>

        </select>

      </div>

    </div>


    <button
      class="save-btn"
      onclick="saveEmployee()"
    >
      💾 Сақлаш
    </button>


    <button
      class="cancel-btn"
      onclick="closeForm()"
    >
      Бекор қилиш
    </button>

  </div>


  <!-- SEARCH -->

  <div class="search-box">

    <label>
      🔎 Ходим қидириш
    </label>

    <input
      id="searchInput"
      type="text"
      placeholder="Исм ёки Telegram ID бўйича қидиринг..."
      oninput="filterEmployees()"
    >

  </div>


  <!-- TABLE -->

  <div class="table-box">

    <table>

      <thead>

        <tr>

          <th>ID</th>

          <th>Ходим</th>

          <th>Telegram ID</th>

          <th>Филиал</th>

          <th>Роль</th>

          <th>Амаллар</th>

        </tr>

      </thead>


      <tbody id="employeeTable">

        <tr>

          <td
            colspan="6"
            class="loading"
          >
            Маълумотлар юкланмоқда...
          </td>

        </tr>

      </tbody>

    </table>

  </div>

</div>


<script>

const API =
  "https://qyvglgcjsqifyubmpahw.supabase.co/functions/v1/smart-endpoint";


let employeesList = [];


/* =====================================================
   MESSAGE
===================================================== */

function showMessage(
  text,
  type
) {

  const box =
    document.getElementById(
      "message"
    );

  box.textContent =
    text;

  box.className =
    "message " +
    type;

  box.style.display =
    "block";

}


/* =====================================================
   OPEN ADD FORM
===================================================== */

function openAddForm() {

  document
    .getElementById(
      "formTitle"
    )
    .textContent =
    "Янги ходим қўшиш";


  document
    .getElementById(
      "editId"
    )
    .value =
    "";


  document
    .getElementById(
      "fullName"
    )
    .value =
    "";


  document
    .getElementById(
      "telegramId"
    )
    .value =
    "";


  document
    .getElementById(
      "branchId"
    )
    .value =
    "";


  document
    .getElementById(
      "role"
    )
    .value =
    "employee";


  document
    .getElementById(
      "formBox"
    )
    .classList
    .add("show");

}


/* =====================================================
   CLOSE FORM
===================================================== */

function closeForm() {

  document
    .getElementById(
      "formBox"
    )
    .classList
    .remove("show");

}


/* =====================================================
   LOAD BRANCHES
===================================================== */

async function loadBranches() {

  try {

    const response =
      await fetch(
        API +
        "?view=branches"
      );

    const data =
      await response.json();


    const branches =
      Array.isArray(data)
        ? data
        : (
          Array.isArray(
            data.branches
          )
            ? data.branches
            : []
        );


    const select =
      document.getElementById(
        "branchId"
      );


    select.innerHTML =
      '<option value="">Филиални танланг</option>';


    branches.forEach(
      function(branch) {

        const option =
          document.createElement(
            "option"
          );

        option.value =
          branch.id;

        option.textContent =
          branch.name;

        select.appendChild(
          option
        );

      }
    );

  } catch (error) {

    console.error(
      "BRANCH ERROR:",
      error
    );

  }

}


/* =====================================================
   LOAD EMPLOYEES
===================================================== */

async function loadEmployees() {

  const table =
    document.getElementById(
      "employeeTable"
    );


  try {

    const response =
      await fetch(
        API +
        "?view=employees"
      );


    const data =
      await response.json();


    console.log(
      "EMPLOYEES:",
      data
    );


    employeesList =
      Array.isArray(data)
        ? data
        : (
          Array.isArray(
            data.employees
          )
            ? data.employees
            : []
        );


    renderEmployees(
      employeesList
    );


  } catch (error) {

    console.error(
      "EMPLOYEE ERROR:",
      error
    );


    table.innerHTML =
      `
      <tr>
        <td
          colspan="6"
          class="loading"
        >
          Ходимларни олишда хато
        </td>
      </tr>
      `;

  }

}


/* =====================================================
   RENDER EMPLOYEES
===================================================== */

function renderEmployees(
  employees
) {

  const table =
    document.getElementById(
      "employeeTable"
    );


  table.innerHTML =
    "";


  if (
    employees.length === 0
  ) {

    table.innerHTML =
      `
      <tr>
        <td
          colspan="6"
          class="loading"
        >
          Ходимлар топилмади
        </td>
      </tr>
      `;

    return;

  }


  employees.forEach(
    function(employee) {

      const row =
        document.createElement(
          "tr"
        );


      const idCell =
        document.createElement(
          "td"
        );

      idCell.textContent =
        employee.id ?? "";

      row.appendChild(
        idCell
      );


      const nameCell =
        document.createElement(
          "td"
        );

      nameCell.textContent =
        employee.full_name ?? "";

      row.appendChild(
        nameCell
      );


      const telegramCell =
        document.createElement(
          "td"
        );

      telegramCell.textContent =
        employee.telegram_id ?? "";

      row.appendChild(
        telegramCell
      );


      const branchCell =
        document.createElement(
          "td"
        );

      branchCell.textContent =
        employee.branch_name ||
        employee.branch_id ||
        "";

      row.appendChild(
        branchCell
      );


      const roleCell =
        document.createElement(
          "td"
        );

      roleCell.textContent =
        employee.role ||
        "employee";

      row.appendChild(
        roleCell
      );


      const actionCell =
        document.createElement(
          "td"
        );


      const editButton =
        document.createElement(
          "button"
        );

      editButton.className =
        "edit-btn";

      editButton.textContent =
        "✏️ Таҳрир";

      editButton.onclick =
        function() {

          editEmployee(
            employee
          );

        };


      actionCell.appendChild(
        editButton
      );


      const deleteButton =
        document.createElement(
          "button"
        );

      deleteButton.className =
        "delete-btn";

      deleteButton.textContent =
        "🗑 Ўчириш";

      deleteButton.onclick =
        function() {

          deleteEmployee(
            employee
          );

        };


      actionCell.appendChild(
        deleteButton
      );


      row.appendChild(
        actionCell
      );


      table.appendChild(
        row
      );

    }
  );

}


/* =====================================================
   SEARCH
===================================================== */

function filterEmployees() {

  const search =
    document
      .getElementById(
        "searchInput"
      )
      .value
      .toLowerCase()
      .trim();


  if (!search) {

    renderEmployees(
      employeesList
    );

    return;

  }


  const filtered =
    employeesList.filter(
      function(employee) {

        const name =
          String(
            employee.full_name || ""
          )
          .toLowerCase();


        const telegram =
          String(
            employee.telegram_id || ""
          )
          .toLowerCase();


        const branch =
          String(
            employee.branch_name || ""
          )
          .toLowerCase();


        return (
          name.includes(search) ||
          telegram.includes(search) ||
          branch.includes(search)
        );

      }
    );


  renderEmployees(
    filtered
  );

}


/* =====================================================
   EDIT EMPLOYEE
===================================================== */

function editEmployee(
  employee
) {

  document
    .getElementById(
      "formTitle"
    )
    .textContent =
    "✏️ Ходимни таҳрирлаш";


  document
    .getElementById(
      "editId"
    )
    .value =
    employee.id;


  document
    .getElementById(
      "fullName"
    )
    .value =
    employee.full_name || "";


  document
    .getElementById(
      "telegramId"
    )
    .value =
    employee.telegram_id || "";


  document
    .getElementById(
      "branchId"
    )
    .value =
    employee.branch_id || "";


  document
    .getElementById(
      "role"
    )
    .value =
    employee.role || "employee";


  document
    .getElementById(
      "formBox"
    )
    .classList
    .add("show");


  window.scrollTo(
    {
      top: 0,
      behavior: "smooth"
    }
  );

}


/* =====================================================
   SAVE EMPLOYEE
===================================================== */

async function saveEmployee() {

  const editId =
    document
      .getElementById(
        "editId"
      )
      .value;


  const fullName =
    document
      .getElementById(
        "fullName"
      )
      .value
      .trim();


  const telegramId =
    document
      .getElementById(
        "telegramId"
      )
      .value
      .trim();


  const branchId =
    document
      .getElementById(
        "branchId"
      )
      .value;


  const role =
    document
      .getElementById(
        "role"
      )
      .value;


  if (!fullName) {

    showMessage(
      "Ф.И.О. киритинг",
      "error"
    );

    return;

  }


  if (!telegramId) {

    showMessage(
      "Telegram ID киритинг",
      "error"
    );

    return;

  }


  try {

    let response;


    if (editId) {

      response =
        await fetch(
          API +
          "?view=employee_update",
          {
            method:
              "PATCH",

            headers: {
              "Content-Type":
                "application/json"
            },

            body:
              JSON.stringify(
                {
                  id:
                    Number(
                      editId
                    ),

                  full_name:
                    fullName,

                  telegram_id:
                    Number(
                      telegramId
                    ),

                  branch_id:
                    branchId
                      ? Number(
                          branchId
                        )
                      : null,

                  role:
                    role
                }
              )
          }
        );

    } else {

      response =
        await fetch(
          API +
          "?view=employee_add",
          {
            method:
              "POST",

            headers: {
              "Content-Type":
                "application/json"
            },

            body:
              JSON.stringify(
                {
                  full_name:
                    fullName,

                  telegram_id:
                    Number(
                      telegramId
                    ),

                  branch_id:
                    branchId
                      ? Number(
                          branchId
                        )
                      : null,

                  role:
                    role
                }
              )
          }
        );

    }


    const data =
      await response.json();


    console.log(
      "SAVE EMPLOYEE:",
      data
    );


    if (
      !response.ok ||
      !data.success
    ) {

      throw new Error(
        data.error ||
        "Маълумот сақланмади"
      );

    }


    showMessage(
      editId
        ? "✅ Ходим маълумотлари янгиланди"
        : "✅ Ходим муваффақиятли қўшилди",
      "success"
    );


    closeForm();

    loadEmployees();

  } catch (error) {

    console.error(
      "SAVE ERROR:",
      error
    );


    showMessage(
      "❌ " +
      error.message,
      "error"
    );

  }

}


/* =====================================================
   DELETE EMPLOYEE
===================================================== */

async function deleteEmployee(
  employee
) {

  if (
    Number(employee.id) === 1
  ) {

    showMessage(
      "❌ Асосий администраторни ўчириш мумкин эмас",
      "error"
    );

    return;

  }


  const confirmed =
    confirm(
      "⚠️ " +
      employee.full_name +
      "\n\nУшбу ходимни ўчиришни тасдиқлайсизми?"
    );


  if (!confirmed) {

    return;

  }


  try {

    const response =
      await fetch(
        API +
        "?view=employee_delete&id=" +
        encodeURIComponent(
          employee.id
        ),
        {
          method:
            "DELETE"
        }
      );


    const data =
      await response.json();


    console.log(
      "DELETE EMPLOYEE:",
      data
    );


    if (
      !response.ok ||
      !data.success
    ) {

      throw new Error(
        data.error ||
        "Ходим ўчирилмади"
      );

    }


    showMessage(
      "✅ Ходим ўчирилди",
      "success"
    );


    loadEmployees();

  } catch (error) {

    console.error(
      "DELETE ERROR:",
      error
    );


    showMessage(
      "❌ " +
      error.message,
      "error"
    );

  }

}


/* =====================================================
   START
===================================================== */

loadBranches();

loadEmployees();

</script>

</body>
</html>
```
