<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>GPS Tracking</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>

<body>

<h2>📍 GPS кузатув</h2>

<p id="status">
  Локация аниқланмоқда...
</p>

<script>

const SUPABASE_URL =
  "https://qyvglgcjsqifyubmpahw.supabase.co";

const EDGE_FUNCTION =
  SUPABASE_URL +
  "/functions/v1/smart-endpoint";

async function sendLocation(position) {

  const latitude =
    position.coords.latitude;

  const longitude =
    position.coords.longitude;

  document.getElementById("status").textContent =
    "📍 Локация юборилмоқда...";

  try {

    const telegramId =
  new URLSearchParams(
    window.location.search
  ).get("telegram_id");

    if (!telegramId) {

      document.getElementById("status").textContent =
        "❌ Telegram ID топилмади";

      return;
    }

    const response = await fetch(
      EDGE_FUNCTION + "?view=location",
      {
        method: "POST",

        headers: {
          "Content-Type": "application/json"
        },

        body: JSON.stringify({
          telegram_id: telegramId,
          latitude: latitude,
          longitude: longitude
        })
      }
    );

    const result =
      await response.json();

    if (!response.ok) {

      throw new Error(
        result.error || "GPS юборишда хато"
      );
    }

    document.getElementById("status").textContent =
      "✅ GPS янгиланди: " +
      latitude.toFixed(6) +
      ", " +
      longitude.toFixed(6);

  } catch (error) {

    console.error(error);

    document.getElementById("status").textContent =
      "❌ " + error.message;
  }
}
function locationError(error) {

  document.getElementById("status").textContent =
    "❌ GPS олишда хато: " +
    error.message;

}

function getLocation() {

  navigator.geolocation.getCurrentPosition(
    sendLocation,
    locationError,
    {
      enableHighAccuracy: true,
      timeout: 15000,
      maximumAge: 0
    }
  );

}

getLocation();

setInterval(
  getLocation,
  30000
);

</script>

</body>
</html>
