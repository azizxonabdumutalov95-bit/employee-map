<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GPS огоҳлантиришлар</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      color: #222;
    }

    .container {
      max-width: 1200px;
      margin: auto;
      padding: 24px;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 20px;
    }

    h1 {
      font-size: 26px;
      margin: 0;
    }

    button, input, select {
      font: inherit;
    }

    button {
      cursor: pointer;
      border: 0;
      border-radius: 7px;
      padding: 10px 14px;
    }

    .refresh-btn {
      background: #2563eb;
      color: white;
    }

    .filters {
      background: white;
      padding: 16px;
      border-radius: 12px;
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 20px;
    }

    .filters input,
    .filters select {
      padding: 10px;
      border: 1px solid #ddd;
      border-radius: 7px;
      min-width: 220px;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 15px;
      margin-bottom: 20px;
    }

    .stat {
      background: white;
      border-radius: 12px;
      padding: 18px;
      box-shadow: 0 2px 8px #0000000d;
    }

    .stat-title {
      color: #666;
      margin-bottom: 8px;
    }

    .stat-value {
      font-size: 28px;
      font-weight: bold;
    }

    .active-value {
      color: #dc2626;
    }

    .resolved-value {
      color: #16a34a;
    }

    .table-box {
      background: white;
      border-radius: 12px;
      overflow-x: auto;
    }

    table {
      width: 100%;
      min-width: 850px;
      border-collapse: collapse;
    }

    th, td {
      padding: 13px 12px;
      text-align: left;
      border-bottom: 1px solid #eee;
    }

    th {
      background: #f8fafc;
    }

    .status {
      display: inline-block;
      padding: 6px 10px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: bold;
      white-space: nowrap;
    }

    .status-active {
      background: #fee2e2;
      color: #b91c1c;
    }

    .status-resolved {
      background: #dcfce7;
      color: #15803d;
    }

    .empty, .error {
      text-align: center;
      padding: 30px;
    }

    .error {
      color: #b91c1c;
    }

    .resolve-btn {
      background: #16a34a;
      color: white;
      white-space: nowrap;
    }

    .resolve-btn:disabled {
      opacity: 0.6;
      cursor: wait;
    }

    @media (max-width: 700px) {
      .container {
        padding: 12px;
      }

      .stats {
        grid-template-columns: 1fr;
      }

      h1 {
        font-size: 22px;
      }

      .filters input,
      .filters select {
        width: 100%;
      }
    }
  </style>
</head>

<body>
<div class="container">

<div class="header">
  <h1>🚨 Огоҳлантиришлар</h1>

  <div>
    <button class="refresh-btn" onclick="loadAlerts()">
      🔄 Янгилаш
    </button>

    <button
      class="refresh-btn"
      onclick="closeAllAlerts()"
      style="margin-left: 8px; background: #16a34a;"
    >
      ✅ Барчасини ёпиш
    </button>
  </div>
</div>

  <div class="filters">
    <input
      type="text"
      id="searchInput"
      placeholder="🔎 Ходимни қидириш..."
      oninput="filterAlerts()"
    >

    <select id="statusFilter" onchange="filterAlerts()">
      <option value="all">Барчаси</option>
      <option value="active">🔴 Фаол</option>
      <option value="resolved">✅ Ёпилган</option>
    </select>
  </div>

  <div class="stats">
    <div class="stat">
      <div class="stat-title">Жами Alert</div>
      <div class="stat-value" id="totalCount">0</div>
    </div>

    <div class="stat">
      <div class="stat-title">Фаол</div>
      <div class="stat-value active-value" id="activeCount">0</div>
    </div>

    <div class="stat">
      <div class="stat-title">Ёпилган</div>
      <div class="stat-value resolved-value" id="resolvedCount">0</div>
    </div>
  </div>

  <div class="table-box">
    <table>
      <thead>
        <tr>
          <th>Ходим</th>
          <th>Огоҳлантириш</th>
          <th>Яратилган вақт</th>
          <th>Ҳолат</th>
          <th>Ёпилган вақт</th>
          <th>Амал</th>
        </tr>
      </thead>

      <tbody id="alertsTable">
        <tr>
          <td colspan="6" class="empty">⏳ Юкланмоқда...</td>
        </tr>
      </tbody>
    </table>
  </div>

</div>

<script>
"use strict";

const API =
  "https://qyvglgcjsqifyubmpahw.supabase.co/functions/v1/smart-endpoint";

let alertsList = [];

async function loadAlerts() {
  const table = document.getElementById("alertsTable");

  table.innerHTML =
    '<tr><td colspan="6" class="empty">⏳ Маълумот олинмоқда...</td></tr>';

  try {
   const telegramUserId =
  window.Telegram?.WebApp?.initDataUnsafe?.user?.id ||
  new URLSearchParams(window.location.search).get("telegram_id") ||
  "";

const response = await fetch(
  API +
    "?view=alerts" +
    "&telegram_id=" +
    encodeURIComponent(telegramUserId) +
    "&t=" +
    Date.now(),
      {
        method: "GET",
        cache: "no-store"
      }
    );

    const data = await response.json();

    if (!response.ok) {
      throw new Error(
        data.error || "HTTP " + response.status
      );
    }

    if (data.success !== true) {
      throw new Error(
        data.error || "API маълумотни тасдиқламади"
      );
    }

    if (!Array.isArray(data.alerts)) {
      throw new Error("API alerts рўйхатини қайтармади");
    }

    alertsList = data.alerts;

    updateStats();
    filterAlerts();

  } catch (error) {
    console.error("LOAD ALERTS ERROR:", error);

    table.innerHTML = "";

    const row = document.createElement("tr");
    const cell = document.createElement("td");

    cell.colSpan = 6;
    cell.className = "error";
    cell.textContent =
      "❌ Маълумот олинмади: " + error.message;

    row.appendChild(cell);
    table.appendChild(row);
  }
}

function updateStats() {
  document.getElementById("totalCount").textContent =
    alertsList.length;

  document.getElementById("activeCount").textContent =
    alertsList.filter(a => a.status === "active").length;

  document.getElementById("resolvedCount").textContent =
    alertsList.filter(a => a.status === "resolved").length;
}

function filterAlerts() {
  const search = document.getElementById("searchInput")
    .value.trim().toLowerCase();

  const status = document.getElementById("statusFilter").value;

  const filtered = alertsList.filter(alert => {
    const name = String(
      alert.employee_name || ""
    ).toLowerCase();

    const matchesName = name.includes(search);

    const matchesStatus =
      status === "all" || alert.status === status;

    return matchesName && matchesStatus;
  });

  renderAlerts(filtered);
}

function renderAlerts(alerts) {
  const table = document.getElementById("alertsTable");
  table.innerHTML = "";

  if (alerts.length === 0) {
    const row = document.createElement("tr");
    const cell = document.createElement("td");

    cell.colSpan = 6;
    cell.className = "empty";
    cell.textContent =
      alertsList.length === 0
        ? "Ҳозирча огоҳлантиришлар йўқ"
        : "🔎 Қидирувга мос маълумот топилмади";

    row.appendChild(cell);
    table.appendChild(row);
    return;
  }

  alerts.forEach(alert => {
    const row = document.createElement("tr");

    addCell(row, alert.employee_name || "Номаълум ходим");
    addCell(row, alert.message || alert.alert_type || "—");
    addCell(row, formatDate(alert.created_at));

    const statusCell = document.createElement("td");
    const badge = document.createElement("span");

    badge.className = "status " +
      (alert.status === "active"
        ? "status-active"
        : "status-resolved");

    badge.textContent = alert.status === "active"
      ? "🔴 Фаол"
      : "✅ Ёпилган";

    statusCell.appendChild(badge);
    row.appendChild(statusCell);

    addCell(row, formatDate(alert.resolved_at));

    const actionCell = document.createElement("td");

    if (alert.status === "active") {
      const button = document.createElement("button");

      button.className = "resolve-btn";
      button.textContent = "✅ Ёпиш";

      button.addEventListener("click", () => {
        resolveAlert(alert.id, button);
      });

      actionCell.appendChild(button);
    } else {
      actionCell.textContent = "—";
    }

    row.appendChild(actionCell);
    table.appendChild(row);
  });
}

function addCell(row, value) {
  const cell = document.createElement("td");
  cell.textContent = value == null ? "—" : String(value);
  row.appendChild(cell);
}
async function resolveAlert(alertId, button) {
  if (!alertId) {
    window.alert("Alert ID топилмади");
    return;
  }

  if (!window.confirm("Ушбу огоҳлантиришни ёпасизми?")) {
    return;
  }

  button.disabled = true;
  button.textContent = "⏳ Кутинг...";

  try {
    const response = await fetch(
      API + "?view=alert_resolve",
      {
        method: "PATCH",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          id: alertId,
          telegram_id:
            window.Telegram?.WebApp?.initDataUnsafe?.user?.id ||
            new URLSearchParams(window.location.search).get("telegram_id") ||
            ""
        })
      }
    );

    const result = await response.json();

    if (!response.ok || result.success !== true) {
      throw new Error(
        result.error || "Alertни ёпишда хато"
      );
    }

    await loadAlerts();

  } catch (error) {
    console.error("RESOLVE ALERT ERROR:", error);

    window.alert(
      "❌ Alertни ёпишда хато:\n" + error.message
    );

    button.disabled = false;
    button.textContent = "✅ Ёпиш";
  }
}


/* =====================================================
   CLOSE ALL ALERTS
===================================================== */

async function closeAllAlerts() {

  if (
    !window.confirm(
      "Барча фаол alertларни ёпасизми?"
    )
  ) {
    return;
  }

  try {

 const telegramId =
  window.Telegram?.WebApp?.initDataUnsafe?.user?.id ||
  new URLSearchParams(
    window.location.search
  ).get("telegram_id") ||
  "1990912017";

    const response =
      await fetch(
        API +
        "?view=alert_resolve_all",
        {
          method: "PATCH",

          headers: {
            "Content-Type":
              "application/json"
          },

          body: JSON.stringify({
            telegram_id:
              telegramId
          })
        }
      );

    const result =
      await response.json();

    if (
      !response.ok ||
      result.success !== true
    ) {
      throw new Error(
        result.error ||
        "Alertларни ёпишда хато"
      );
    }

    window.alert(
      "✅ " +
      (result.closed || 0) +
      " ta alert yopildi"
    );

    await loadAlerts();

  } catch (error) {

    console.error(
      "CLOSE ALL ALERTS ERROR:",
      error
    );

    window.alert(
      "❌ Alertларни ёпишда хато:\n" +
      error.message
    );

  }

}


function formatDate(value) {
  if (!value) return "—";

  const date = new Date(value);

  if (Number.isNaN(date.getTime())) {
    return "—";
  }

  return date.toLocaleString("uz-UZ", {
    timeZone: "Asia/Tashkent",
    year: "numeric",
    month: "2-digit",
    day: "2-digit",
    hour: "2-digit",
    minute: "2-digit"
  });
}

loadAlerts();

</script>

</body>
</html>
