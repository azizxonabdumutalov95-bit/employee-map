<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Филиал ҳисоботи</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f7fb;
      color: #222;
    }

    .container {
      max-width: 1400px;
      margin: 0 auto;
      padding: 25px;
    }

    h1 {
      margin-bottom: 20px;
    }

    .top-bar {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      align-items: center;
      margin-bottom: 20px;
    }

    input,
    button {
      padding: 10px 14px;
      border-radius: 8px;
      border: 1px solid #ccc;
      font-size: 14px;
    }

    button {
      cursor: pointer;
      background: #2563eb;
      color: white;
      border: none;
    }

    button:hover {
      opacity: 0.9;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 15px;
      margin-bottom: 25px;
    }

    .card {
      background: white;
      border-radius: 12px;
      padding: 18px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    .card-title {
      font-size: 13px;
      color: #666;
      margin-bottom: 8px;
    }

    .card-value {
      font-size: 25px;
      font-weight: bold;
    }

    .table-box {
      background: white;
      border-radius: 12px;
      padding: 15px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 950px;
    }

    th,
    td {
      padding: 12px 10px;
      border-bottom: 1px solid #eee;
      text-align: left;
    }

    th {
      background: #f1f5f9;
      font-weight: bold;
      white-space: nowrap;
    }

    tr:hover {
      background: #f8fafc;
    }

    .status {
      display: inline-block;
      padding: 5px 9px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: bold;
    }

    .status-active {
      background: #dcfce7;
      color: #166534;
    }

    .status-normal {
      background: #e0f2fe;
      color: #075985;
    }

    .status-empty {
      background: #f1f5f9;
      color: #64748b;
    }

    .loading {
      text-align: center;
      padding: 30px;
      color: #666;
    }

    .error {
      background: #fee2e2;
      color: #991b1b;
      padding: 15px;
      border-radius: 8px;
      margin-bottom: 20px;
      display: none;
      white-space: pre-wrap;
    }

    @media (max-width: 1100px) {
      .cards {
        grid-template-columns: repeat(3, 1fr);
      }
    }

    @media (max-width: 650px) {
      .container {
        padding: 12px;
      }

      .cards {
        grid-template-columns: repeat(2, 1fr);
      }

      .card-value {
        font-size: 20px;
      }
    }
  </style>
</head>

<body>

<div class="container">

  <h1>📊 Филиал ҳисоботи</h1>

  <div class="top-bar">

    <label>
      Сана:
      <input type="date" id="dateInput">
    </label>

    <input
      type="text"
      id="searchInput"
      placeholder="Филиал қидириш..."
    >

    <button onclick="loadReport()">
      🔄 Янгилаш
    </button>

  </div>

  <div id="errorBox" class="error"></div>

  <div class="cards">

    <div class="card">
      <div class="card-title">Жами филиал</div>
      <div class="card-value" id="totalBranches">0</div>
    </div>

    <div class="card">
      <div class="card-title">Жами ходим</div>
      <div class="card-value" id="totalEmployees">0</div>
    </div>

    <div class="card">
      <div class="card-title">Ишлаган ходим</div>
      <div class="card-value" id="workedEmployees">0</div>
    </div>

    <div class="card">
      <div class="card-title">Ишламаган ходим</div>
      <div class="card-value" id="notWorkedEmployees">0</div>
    </div>

    <div class="card">
      <div class="card-title">Актив ходим</div>
      <div class="card-value" id="activeEmployees">0</div>
    </div>

    <div class="card">
      <div class="card-title">Жами иш вақти</div>
      <div class="card-value" id="totalWorkTime">0 соат</div>
    </div>

  </div>

  <div class="table-box">

    <div id="loading" class="loading">
      Маълумотлар юкланмоқда...
    </div>

    <table id="reportTable" style="display:none;">

      <thead>
        <tr>
          <th>№</th>
          <th>Филиал</th>
          <th>Жами ходим</th>
          <th>Ишлаган</th>
          <th>Ишламаган</th>
          <th>Актив</th>
          <th>Жами иш вақти</th>
          <th>Сессиялар</th>
          <th>Ҳолат</th>
        </tr>
      </thead>

      <tbody id="reportBody"></tbody>

    </table>

  </div>

</div>


<script>

const SUPABASE_URL =
  "https://qyvglgcjsqifyubmpahw.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_2DotFSs_dpuB97oSeqgepg_OErV7nyc";


function supabaseGet(table, params = {}) {

  const url = new URL(
    SUPABASE_URL + "/rest/v1/" + table
  );

  Object.entries(params).forEach(([key, value]) => {
    url.searchParams.set(key, value);
  });

  return fetch(url, {
    method: "GET",

    headers: {
      apikey: SUPABASE_KEY,
      Authorization: "Bearer " + SUPABASE_KEY
    }
  }).then(async response => {

    const text = await response.text();

    if (!response.ok) {
      throw new Error(
        response.status + " " + text
      );
    }

    return text ? JSON.parse(text) : [];
  });
}


function formatDuration(seconds) {

  seconds = Math.max(
    0,
    Math.floor(seconds || 0)
  );

  const hours =
    Math.floor(seconds / 3600);

  const minutes =
    Math.floor((seconds % 3600) / 60);

  if (hours > 0) {
    return hours + " соат " +
           minutes + " дақиқа";
  }

  return minutes + " дақиқа";
}


function formatDateTime(value) {

  if (!value) return "-";

  const d = new Date(value);

  return d.toLocaleTimeString(
    "uz-UZ",
    {
      hour: "2-digit",
      minute: "2-digit"
    }
  );
}


function mergeIntervals(intervals) {

  if (!intervals.length) {
    return [];
  }

  intervals.sort(
    (a, b) => a[0] - b[0]
  );

  const merged = [
    intervals[0].slice()
  ];

  for (let i = 1; i < intervals.length; i++) {

    const current = intervals[i];

    const last =
      merged[merged.length - 1];

    if (current[0] <= last[1]) {

      if (current[1] > last[1]) {
        last[1] = current[1];
      }

    } else {

      merged.push(
        current.slice()
      );

    }
  }

  return merged;
}


function calculateEmployeeData(
  employee,
  sessions,
  dayStart,
  dayEnd
) {

  const intervals = [];

  let sessionCount = 0;
  let active = false;

  for (const session of sessions) {

    const start =
      new Date(session.started_at);

    if (isNaN(start.getTime())) {
      continue;
    }

    let end;

    if (session.ended_at) {

      end = new Date(
        session.ended_at
      );

    } else if (session.finished_at) {

      end = new Date(
        session.finished_at
      );

    } else {

      end = new Date();

      if (
        session.status === "active"
      ) {
        active = true;
      }
    }

    if (isNaN(end.getTime())) {
      continue;
    }

    const startMs =
      Math.max(
        start.getTime(),
        dayStart.getTime()
      );

    const endMs =
      Math.min(
        end.getTime(),
        dayEnd.getTime()
      );

    if (endMs > startMs) {

      intervals.push([
        startMs,
        endMs
      ]);

      sessionCount++;

    }
  }

  const merged =
    mergeIntervals(intervals);

  let totalSeconds = 0;

  for (const interval of merged) {

    totalSeconds +=
      (interval[1] - interval[0]) / 1000;

  }

  return {
    employeeId: employee.id,
    branchId: employee.branch_id,
    totalSeconds,
    sessionCount,
    active
  };
}


async function loadReport() {

  const errorBox =
    document.getElementById("errorBox");

  errorBox.style.display = "none";
  errorBox.textContent = "";

  document.getElementById(
    "loading"
  ).style.display = "block";

  document.getElementById(
    "reportTable"
  ).style.display = "none";

  try {

    const dateValue =
      document.getElementById(
        "dateInput"
      ).value;

    if (!dateValue) {
      throw new Error(
        "Сана танланмаган."
      );
    }


    /*
      Ўзбекистон вақти +05:00
    */

    const dayStart =
      new Date(
        dateValue + "T00:00:00+05:00"
      );

    const nextDay =
      new Date(
        dayStart.getTime() +
        24 * 60 * 60 * 1000
      );

    const now =
      new Date();


    /*
      1. Филиаллар
    */

    const branches =
      await supabaseGet(
        "branches",
        {
          select: "id,name",
          order: "name.asc"
        }
      );


    /*
      2. Ходимлар
    */

    const employees =
      await supabaseGet(
        "employees",
        {
          select:
            "id,full_name,telegram_id,branch_id"
        }
      );


    /*
      3. Work sessions
    */

    const sessions =
      await supabaseGet(
        "work_sessions",
        {
          select:
            "id,employee_id,started_at,finished_at,ended_at,status,duration_seconds",

          started_at:
            "lt." +
            nextDay.toISOString(),

          order:
            "started_at.asc"
        }
      );


    /*
      Ходимлар бўйича sessionларни
      гуруҳлаймиз
    */

    const sessionsByEmployee =
      {};

    for (const session of sessions) {

      if (
        !sessionsByEmployee[
          session.employee_id
        ]
      ) {

        sessionsByEmployee[
          session.employee_id
        ] = [];

      }

      sessionsByEmployee[
        session.employee_id
      ].push(session);

    }


    /*
      Филиаллар статистикаси
    */

    const branchStats = {};


    for (const branch of branches) {

      branchStats[branch.id] = {

        id: branch.id,

        name: branch.name,

        totalEmployees: 0,

        workedEmployees: 0,

        notWorkedEmployees: 0,

        activeEmployees: 0,

        totalSeconds: 0,

        totalSessions: 0

      };

    }


    /*
      Ходимларни ҳисоблаш
    */

    let totalEmployees = 0;
    let workedEmployees = 0;
    let notWorkedEmployees = 0;
    let activeEmployees = 0;
    let totalWorkSeconds = 0;


    for (const employee of employees) {

      totalEmployees++;


      const employeeSessions =
        sessionsByEmployee[
          employee.id
        ] || [];


      const data =
        calculateEmployeeData(
          employee,
          employeeSessions,
          dayStart,
          nextDay
        );


      const branchId =
        employee.branch_id;


      /*
        Агар филиал топилмаса
        статистикага қўшмаймиз
      */

      if (
        branchId &&
        branchStats[branchId]
      ) {

        const branch =
          branchStats[branchId];

        branch.totalEmployees++;

        branch.totalSeconds +=
          data.totalSeconds;

        branch.totalSessions +=
          data.sessionCount;

        if (data.totalSeconds > 0) {

          branch.workedEmployees++;

        } else {

          branch.notWorkedEmployees++;

        }

        if (data.active) {

          branch.activeEmployees++;

        }

      }


      if (data.totalSeconds > 0) {

        workedEmployees++;

        totalWorkSeconds +=
          data.totalSeconds;

      } else {

        notWorkedEmployees++;

      }


      if (data.active) {

        activeEmployees++;

      }

    }


    /*
      Summary
    */

    document.getElementById(
      "totalBranches"
    ).textContent =
      branches.length;


    document.getElementById(
      "totalEmployees"
    ).textContent =
      totalEmployees;


    document.getElementById(
      "workedEmployees"
    ).textContent =
      workedEmployees;


    document.getElementById(
      "notWorkedEmployees"
    ).textContent =
      notWorkedEmployees;


    document.getElementById(
      "activeEmployees"
    ).textContent =
      activeEmployees;


    document.getElementById(
      "totalWorkTime"
    ).textContent =
      formatDuration(
        totalWorkSeconds
      );


    /*
      Jadval
    */

    renderTable(
      branches,
      branchStats
    );


    document.getElementById(
      "loading"
    ).style.display = "none";


    document.getElementById(
      "reportTable"
    ).style.display = "table";


  } catch (error) {

    console.error(error);

    document.getElementById(
      "loading"
    ).style.display = "none";

    errorBox.style.display = "block";

    errorBox.textContent =
      "❌ Хато:\n" +
      error.message;

  }

}


function renderTable(
  branches,
  branchStats
) {

  const tbody =
    document.getElementById(
      "reportBody"
    );

  tbody.innerHTML = "";


  const search =
    document.getElementById(
      "searchInput"
    ).value
      .trim()
      .toLowerCase();


  let number = 0;


  for (const branch of branches) {

    if (
      search &&
      !branch.name
        .toLowerCase()
        .includes(search)
    ) {
      continue;
    }


    const stat =
      branchStats[branch.id];


    if (!stat) {
      continue;
    }


    number++;


    let statusHtml;


    if (
      stat.activeEmployees > 0
    ) {

      statusHtml =
        '<span class="status status-active">' +
        '🟢 Актив' +
        '</span>';

    } else if (
      stat.workedEmployees > 0
    ) {

      statusHtml =
        '<span class="status status-normal">' +
        '🔵 Ишлаган' +
        '</span>';

    } else {

      statusHtml =
        '<span class="status status-empty">' +
        '⚪ Ишламаган' +
        '</span>';

    }


    const row =
      document.createElement("tr");


    row.innerHTML = `

      <td>${number}</td>

      <td>
        <strong>
          ${escapeHtml(branch.name)}
        </strong>
      </td>

      <td>
        ${stat.totalEmployees}
      </td>

      <td>
        ${stat.workedEmployees}
      </td>

      <td>
        ${stat.notWorkedEmployees}
      </td>

      <td>
        ${stat.activeEmployees}
      </td>

      <td>
        ${formatDuration(
          stat.totalSeconds
        )}
      </td>

      <td>
        ${stat.totalSessions}
      </td>

      <td>
        ${statusHtml}
      </td>

    `;


    tbody.appendChild(row);

  }


  if (number === 0) {

    tbody.innerHTML = `
      <tr>
        <td colspan="9"
            style="text-align:center;padding:30px;">
          Маълумот топилмади
        </td>
      </tr>
    `;

  }

}


function escapeHtml(value) {

  return String(value || "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");

}


/*
  Search
*/

document
  .getElementById("searchInput")
  .addEventListener(
    "input",
    loadReport
  );


/*
  Бугунги санани қўямиз
*/

function setToday() {

  const now =
    new Date();

  const year =
    now.getFullYear();

  const month =
    String(
      now.getMonth() + 1
    ).padStart(2, "0");

  const day =
    String(
      now.getDate()
    ).padStart(2, "0");

  document.getElementById(
    "dateInput"
  ).value =
    year + "-" +
    month + "-" +
    day;

}


/*
  Start
*/

setToday();

loadReport();

</script>

</body>
</html>
