<!DOCTYPE html>
<html lang="uz">
<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Xodimlar Dashboard</title>

  <!-- Leaflet -->
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  >

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family:
        Arial,
        Helvetica,
        sans-serif;
      background: #f4f6f8;
      color: #222;
    }

    .container {
      max-width: 1400px;
      margin: auto;
      padding: 20px;
    }

    h1 {
      margin: 0 0 20px 0;
      font-size: 28px;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
      flex-wrap: wrap;
      margin-bottom: 20px;
    }

    .top-buttons {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    button {
      border: none;
      border-radius: 8px;
      padding: 10px 16px;
      cursor: pointer;
      font-size: 14px;
    }

    .btn-primary {
      background: #1976d2;
      color: white;
    }

    .btn-primary:hover {
      background: #125ea8;
    }

    .btn-success {
      background: #2e7d32;
      color: white;
    }

    .btn-danger {
      background: #c62828;
      color: white;
    }

    .btn-secondary {
      background: #607d8b;
      color: white;
    }

    .filters {
      background: white;
      padding: 15px;
      border-radius: 12px;
      margin-bottom: 20px;
      box-shadow:
        0 2px 8px rgba(0,0,0,0.08);
    }

    .filters-row {
      display: flex;
      gap: 15px;
      flex-wrap: wrap;
      align-items: end;
    }

    .filter-item {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .filter-item label {
      font-size: 13px;
      color: #555;
    }

    select,
    input {
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 7px;
      min-width: 180px;
      font-size: 14px;
    }

    .stats {
      display: grid;
      grid-template-columns:
        repeat(
          auto-fit,
          minmax(180px, 1fr)
        );
      gap: 15px;
      margin-bottom: 20px;
    }

    .stat-card {
      background: white;
      padding: 18px;
      border-radius: 12px;
      box-shadow:
        0 2px 8px rgba(0,0,0,0.08);
    }

    .stat-title {
      color: #666;
      font-size: 14px;
      margin-bottom: 8px;
    }

    .stat-value {
      font-size: 28px;
      font-weight: bold;
    }

    .table-card {
      background: white;
      border-radius: 12px;
      box-shadow:
        0 2px 8px rgba(0,0,0,0.08);
      overflow: hidden;
      margin-bottom: 20px;
    }

    .table-header {
      padding: 15px 18px;
      border-bottom: 1px solid #eee;
      font-size: 18px;
      font-weight: bold;
    }

    .table-wrapper {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    th,
    td {
      padding: 12px;
      border-bottom: 1px solid #eee;
      text-align: left;
      white-space: nowrap;
    }

    th {
      background: #f7f7f7;
      font-size: 13px;
    }

    td {
      font-size: 14px;
    }

    tr:hover td {
      background: #fafafa;
    }

    .status {
      display: inline-block;
      padding: 5px 9px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: bold;
    }

    .status-online {
      background: #e8f5e9;
      color: #2e7d32;
    }

    .status-offline {
      background: #ffebee;
      color: #c62828;
    }

    .status-working {
      background: #e3f2fd;
      color: #1565c0;
    }

    .route-button {
      background: #1976d2;
      color: white;
      padding: 8px 12px;
      border-radius: 7px;
    }

    .route-button:hover {
      background: #125ea8;
    }

    .detail {
      display: none;
      background: white;
      border-radius: 12px;
      box-shadow:
        0 2px 8px rgba(0,0,0,0.08);
      margin-top: 20px;
      overflow: hidden;
    }

    .detail-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      padding: 15px 18px;
      border-bottom: 1px solid #eee;
      flex-wrap: wrap;
    }

    .detail-title {
      font-size: 20px;
      font-weight: bold;
    }

    .route-stats {
      display: grid;
      grid-template-columns:
        repeat(
          auto-fit,
          minmax(150px, 1fr)
        );
      gap: 12px;
      padding: 15px;
    }

    .route-stat {
      background: #f5f7fa;
      border-radius: 10px;
      padding: 14px;
    }

    .route-stat-title {
      color: #666;
      font-size: 12px;
      margin-bottom: 5px;
    }

    .route-stat-value {
      font-size: 20px;
      font-weight: bold;
    }

    #routeMap {
      width: 100%;
      height: 550px;
    }

    .loading {
      text-align: center;
      padding: 30px;
      color: #666;
    }

    .error {
      background: #ffebee;
      color: #b71c1c;
      padding: 15px;
      border-radius: 8px;
      margin-bottom: 15px;
      display: none;
    }

    .empty {
      text-align: center;
      padding: 30px;
      color: #777;
    }

    @media (
      max-width: 700px
    ) {

      .container {
        padding: 10px;
      }

      h1 {
        font-size: 22px;
      }

      select,
      input {
        width: 100%;
      }

      .filter-item {
        width: 100%;
      }

      #routeMap {
        height: 450px;
      }

    }

  </style>

</head>

<body>

<div class="container">

  <!-- =========================
       TOP
  ========================== -->

  <div class="topbar">

    <div>
      <h1>
        🖥 Ходимлар Dashboard
      </h1>
    </div>

    <div class="top-buttons">

      <button
        class="btn-primary"
        type="button"
        onclick="loadDashboard()"
      >
        🔄 Янгилаш
      </button>

      <button
        class="btn-secondary"
        type="button"
        onclick="window.location.href='alerts.html'"
      >
        🚨 Alertлар
      </button>

    </div>

  </div>


  <!-- =========================
       ERROR
  ========================== -->

  <div
    id="errorBox"
    class="error"
  ></div>


  <!-- =========================
       FILTERS
  ========================== -->

  <div class="filters">

    <div class="filters-row">

      <div class="filter-item">

        <label>
          📅 Сана
        </label>

        <input
          id="date"
          type="date"
        >

      </div>


      <div class="filter-item">

        <label>
          🏢 Филиал
        </label>

        <select id="branchFilter">

          <option value="">
            Барча филиаллар
          </option>

        </select>

      </div>


      <div class="filter-item">

        <label>
          🔎 Ходим
        </label>

        <input
          id="employeeSearch"
          type="text"
          placeholder="Ходим исмини киритинг"
        >

      </div>

    </div>

  </div>


  <!-- =========================
       STATS
  ========================== -->

  <div class="stats">

    <div class="stat-card">

      <div class="stat-title">
        👥 Жами ходимлар
      </div>

      <div
        id="totalEmployees"
        class="stat-value"
      >
        0
      </div>

    </div>


    <div class="stat-card">

      <div class="stat-title">
        🟢 Ҳозир ишда
      </div>

      <div
        id="workingEmployees"
        class="stat-value"
      >
        0
      </div>

    </div>


    <div class="stat-card">

      <div class="stat-title">
        📍 GPS бор
      </div>

      <div
        id="gpsEmployees"
        class="stat-value"
      >
        0
      </div>

    </div>


    <div class="stat-card">

      <div class="stat-title">
        🔴 GPS йўқ
      </div>

      <div
        id="noGpsEmployees"
        class="stat-value"
      >
        0
      </div>

    </div>

  </div>


  <!-- =========================
       EMPLOYEES TABLE
  ========================== -->

  <div class="table-card">

    <div class="table-header">
      👥 Ходимлар
    </div>

    <div
      id="tableLoading"
      class="loading"
    >
      Маълумот юкланмоқда...
    </div>

    <div
      id="tableWrapper"
      class="table-wrapper"
      style="display:none;"
    >

      <table>

        <thead>

          <tr>

            <th>
              ID
            </th>

            <th>
              Ходим
            </th>

            <th>
              Филиал
            </th>

            <th>
              Ҳолати
            </th>

            <th>
              GPS
            </th>

            <th>
              Охирги GPS
            </th>

            <th>
              Маршрут
            </th>

          </tr>

        </thead>

        <tbody
          id="employeesBody"
        ></tbody>

      </table>

    </div>

    <div
      id="emptyEmployees"
      class="empty"
      style="display:none;"
    >
      Ходимлар топилмади
    </div>

  </div>


  <!-- =========================
       ROUTE DETAIL
  ========================== -->

  <div
    id="detail"
    class="detail"
  >

    <div class="detail-header">

      <div
        id="detailTitle"
        class="detail-title"
      >
        🗺 Ходим маршрути
      </div>

      <button
        type="button"
        class="btn-danger"
        onclick="closeRoute()"
      >
        ✕ Ёпиш
      </button>

    </div>


    <div class="route-stats">

      <div class="route-stat">

        <div class="route-stat-title">
          📍 Нуқталар
        </div>

        <div
          id="routePoints"
          class="route-stat-value"
        >
          0
        </div>

      </div>


      <div class="route-stat">

        <div class="route-stat-title">
          📏 Масофа
        </div>

        <div
          id="routeDistance"
          class="route-stat-value"
        >
          0.00 км
        </div>

      </div>


      <div class="route-stat">

        <div class="route-stat-title">
          ⏱ Вақт
        </div>

        <div
          id="routeDuration"
          class="route-stat-value"
        >
          00:00:00
        </div>

      </div>

    </div>


    <div id="routeMap"></div>

  </div>

</div>


<!-- Leaflet JS -->

<script
  src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
></script>


<script>

/* =====================================================
   API
===================================================== */

const API =
  "https://qyvglgcjsqifyubmpahw.supabase.co/functions/v1/smart-endpoint";


/* =====================================================
   GLOBAL VARIABLES
===================================================== */

let dashboardData = {
  employees: []
};

let routeMap = null;

let routeLine = null;

let routeMarkers = [];

let selectedEmployee = null;


/* =====================================================
   DEFAULT DATE
===================================================== */

function setDefaultDate() {

  const input =
    document.getElementById(
      "date"
    );

  const now =
    new Date();

  const year =
    now.getFullYear();

  const month =
    String(
      now.getMonth() + 1
    ).padStart(
      2,
      "0"
    );

  const day =
    String(
      now.getDate()
    ).padStart(
      2,
      "0"
    );

  input.value =
    `${year}-${month}-${day}`;

}


/* =====================================================
   ERROR
===================================================== */

function showError(
  message
) {

  const box =
    document.getElementById(
      "errorBox"
    );

  box.textContent =
    message;

  box.style.display =
    "block";

}


function hideError() {

  const box =
    document.getElementById(
      "errorBox"
    );

  box.textContent =
    "";

  box.style.display =
    "none";

}


/* =====================================================
   LOAD DASHBOARD
===================================================== */

async function loadDashboard() {

  hideError();

  document.getElementById(
    "tableLoading"
  ).style.display =
    "block";

  document.getElementById(
    "tableWrapper"
  ).style.display =
    "none";

  document.getElementById(
    "emptyEmployees"
  ).style.display =
    "none";

  try {

    const url =
      API +
      "?view=dashboard";

    console.log(
      "DASHBOARD URL:",
      url
    );

    const response =
      await fetch(
        url
      );

    const data =
      await response.json();

    console.log(
      "DASHBOARD DATA:",
      data
    );

    if (!response.ok) {

      throw new Error(
        data.error ||
        data.message ||
        "Dashboard маълумотини олишда хато"
      );

    }

    if (
      data.success === false
    ) {

      throw new Error(
        data.error ||
        data.message ||
        "Dashboard маълумотини олишда хато"
      );

    }

    dashboardData =
      data;

    if (
      !Array.isArray(
        dashboardData.employees
      )
    ) {

      dashboardData.employees =
        [];

    }

    buildBranchFilter();

    updateStats();

    renderEmployees();

    document.getElementById(
      "tableLoading"
    ).style.display =
      "none";

    document.getElementById(
      "tableWrapper"
    ).style.display =
      dashboardData.employees.length
        ? "block"
        : "none";

    document.getElementById(
      "emptyEmployees"
    ).style.display =
      dashboardData.employees.length
        ? "none"
        : "block";

  } catch (error) {

    console.error(
      "DASHBOARD ERROR:",
      error
    );

    document.getElementById(
      "tableLoading"
    ).style.display =
      "none";

    showError(
      "Dashboard маълумотини олишда хато: " +
      error.message
    );

  }

}


/* =====================================================
   BRANCH FILTER
===================================================== */

function buildBranchFilter() {

  const select =
    document.getElementById(
      "branchFilter"
    );

  const currentValue =
    select.value;

  const branches =
    [
      ...new Set(
        dashboardData.employees
          .map(
            employee =>
              employee.branch_name ||
              employee.branch ||
              ""
          )
          .filter(
            value =>
              value
          )
      )
    ];

  select.innerHTML =
    `
      <option value="">
        Барча филиаллар
      </option>
    `;

  branches.forEach(
    branch => {

      const option =
        document.createElement(
          "option"
        );

      option.value =
        branch;

      option.textContent =
        branch;

      select.appendChild(
        option
      );

    }
  );

  if (
    branches.includes(
      currentValue
    )
  ) {

    select.value =
      currentValue;

  }

}


/* =====================================================
   FILTER EMPLOYEES
===================================================== */

function getFilteredEmployees() {

  const branch =
    document.getElementById(
      "branchFilter"
    ).value;

  const search =
    document.getElementById(
      "employeeSearch"
    ).value
      .trim()
      .toLowerCase();

  return dashboardData.employees
    .filter(
      employee => {

        const employeeBranch =
          employee.branch_name ||
          employee.branch ||
          "";

        const name =
          (
            employee.full_name ||
            ""
          ).toLowerCase();

        const branchOk =
          !branch ||
          employeeBranch ===
            branch;

        const searchOk =
          !search ||
          name.includes(
            search
          );

        return (
          branchOk &&
          searchOk
        );

      }
    );

}


/* =====================================================
   UPDATE STATS
===================================================== */

function updateStats() {

  const employees =
    getFilteredEmployees();

  const total =
    employees.length;

  const working =
    employees.filter(
      employee =>
        isEmployeeWorking(
          employee
        )
    ).length;

const gps =
  employees.filter(
    employee => {

      const gpsTime =
        employee.last_location_at ||
        (
          employee.last_location &&
          (
            employee.last_location.recorded_at ||
            employee.last_location.created_at
          )
        );

      return !!gpsTime;

    }
  ).length;

  const noGps =
    total - gps;

  document.getElementById(
    "totalEmployees"
  ).textContent =
    total;

  document.getElementById(
    "workingEmployees"
  ).textContent =
    working;

  document.getElementById(
    "gpsEmployees"
  ).textContent =
    gps;

  document.getElementById(
    "noGpsEmployees"
  ).textContent =
    noGps;

}


/* =====================================================
   EMPLOYEE WORKING STATUS
===================================================== */

function isEmployeeWorking(
  employee
) {

  if (
    employee.is_working === true
  ) {

    return true;

  }

  if (
    employee.working === true
  ) {

    return true;

  }

  if (
    employee.status ===
      "working"
  ) {

    return true;

  }

  if (
    employee.work_status ===
      "working"
  ) {

    return true;

  }

  return false;

}


/* =====================================================
   GPS STATUS
===================================================== */

function getGpsStatus(
  employee
) {

  const gpsTime =
    employee.last_location_at ||
    (
      employee.last_location &&
      (
        employee.last_location.recorded_at ||
        employee.last_location.created_at
      )
    );

  if (!gpsTime) {

    return {
      text: "GPS йўқ",
      className:
        "status status-offline"
    };

  }

  const last =
    new Date(
      gpsTime
    );

  if (
    Number.isNaN(
      last.getTime()
    )
  ) {

    return {
      text: "GPS йўқ",
      className:
        "status status-offline"
    };

  }

  const diff =
    Date.now() -
    last.getTime();

  const minutes =
    Math.floor(
      diff / 60000
    );

  if (
    minutes <= 5
  ) {

    return {
      text:
        "🟢 GPS онлайн",
      className:
        "status status-online"
    };

  }

  return {
    text:
      "🟠 " +
      minutes +
      " дақиқа",
    className:
      "status status-working"
  };

}
/* =====================================================
   FORMAT DATE
===================================================== */

function formatDate(
  value
) {

  if (!value) {

    return "-";

  }

  const date =
    new Date(
      value
    );

  if (
    Number.isNaN(
      date.getTime()
    )
  ) {

    return "-";

  }

  return date.toLocaleString(
    "uz-UZ",
    {
      day:
        "2-digit",
      month:
        "2-digit",
      year:
        "numeric",
      hour:
        "2-digit",
      minute:
        "2-digit"
    }
  );

}


/* =====================================================
   RENDER EMPLOYEES
===================================================== */

function renderEmployees() {

  const body =
    document.getElementById(
      "employeesBody"
    );

  const employees =
    getFilteredEmployees();

  body.innerHTML =
    "";

  employees.forEach(
    employee => {

      const row =
        document.createElement(
          "tr"
        );

      const employeeId =
        Number(
          employee.employee_id ??
          employee.id
        );

      const branch =
        employee.branch_name ||
        employee.branch ||
        "-";

      const working =
        isEmployeeWorking(
          employee
        );

      const gps =
        getGpsStatus(
          employee
        );

      row.innerHTML =
        `
          <td>
            ${employeeId || "-"}
          </td>

          <td>
            <b>
              ${
                escapeHtml(
                  employee.full_name ||
                  "Номаълум"
                )
              }
            </b>
          </td>

          <td>
            ${
              escapeHtml(
                branch
              )
            }
          </td>

          <td>

            ${
              working

                ? `
                  <span
                    class="status status-working"
                  >
                    🟢 Ишда
                  </span>
                `

                : `
                  <span
                    class="status status-offline"
                  >
                    ⚪ Ишда эмас
                  </span>
                `
            }

          </td>

          <td>

            <span
              class="${gps.className}"
            >
              ${gps.text}
            </span>

          </td>

          <td>
            ${
              formatDate(
                employee.last_location_at
              )
            }
          </td>

          <td>

            <button
              type="button"
              class="route-button"
              data-route-id="${employeeId}"
            >
              🗺 Кўриш
            </button>

          </td>
        `;

      body.appendChild(
        row
      );

    }
  );


  document
    .querySelectorAll(
      "[data-route-id]"
    )
    .forEach(
      button => {

        button.addEventListener(
          "click",
          function () {

            const id =
              Number(
                this.dataset.routeId
              );

            openEmployeeRoute(
              id
            );

          }
        );

      }
    );

}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHtml(
  value
) {

  return String(
    value
  )
    .replace(
      /&/g,
      "&amp;"
    )
    .replace(
      /</g,
      "&lt;"
    )
    .replace(
      />/g,
      "&gt;"
    )
    .replace(
      /"/g,
      "&quot;"
    )
    .replace(
      /'/g,
      "&#039;"
    );

}


/* =====================================================
   OPEN EMPLOYEE ROUTE
===================================================== */

async function openEmployeeRoute(
  employeeId
) {

  const employee =
    dashboardData &&
    Array.isArray(
      dashboardData.employees
    )

      ? dashboardData.employees.find(
          item =>
            Number(
              item.employee_id ??
              item.id
            ) ===
            Number(
              employeeId
            )
        )

      : null;

  selectedEmployee =
    employee;

  const detail =
    document.getElementById(
      "detail"
    );

  detail.style.display =
    "block";

  document.getElementById(
    "detailTitle"
  ).textContent =
    "🗺 " +
    (
      employee
        ? employee.full_name
        : "Ходим маршрути"
    );

  document.getElementById(
    "routePoints"
  ).textContent =
    "0";

  document.getElementById(
    "routeDistance"
  ).textContent =
    "0.00 км";

  document.getElementById(
    "routeDuration"
  ).textContent =
    "00:00:00";

  initRouteMap();

  setTimeout(
    function () {

      if (
        routeMap
      ) {

        routeMap.invalidateSize();

      }

    },
    300
  );

  const date =
    document.getElementById(
      "date"
    ).value;

  await loadRoute(
    employeeId,
    date
  );

}


/* =====================================================
   INIT ROUTE MAP
===================================================== */

function initRouteMap() {

  if (
    routeMap
  ) {

    return;

  }

  routeMap =
    L.map(
      "routeMap"
    ).setView(
      [
        40.38,
        69.25
      ],
      13
    );

  L.tileLayer(
    "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
    {
      maxZoom: 19,
      attribution:
        "&copy; OpenStreetMap"
    }
  ).addTo(
    routeMap
  );

}


/* =====================================================
   LOAD ROUTE
===================================================== */

async function loadRoute(
  employeeId,
  date
) {

  try {

    const url =
      API +
      "?view=route" +
      "&employee_id=" +
      encodeURIComponent(
        employeeId
      ) +
      "&date=" +
      encodeURIComponent(
        date
      );

    console.log(
      "ROUTE URL:",
      url
    );

    const response =
      await fetch(
        url
      );

    const data =
      await response.json();

    console.log(
      "ROUTE DATA:",
      data
    );

    if (
      !response.ok
    ) {

      throw new Error(
        data.error ||
        data.message ||
        "Route маълумотини олишда хато"
      );

    }

    if (
      data.success !== true
    ) {

      throw new Error(
        data.error ||
        data.message ||
        "Route маълумотини олишда хато"
      );

    }

    if (
      !Array.isArray(
        data.points
      )
    ) {

      throw new Error(
        "Маршрут маълумоти нотўғри форматда"
      );

    }

    const validPoints =
      data.points
        .map(
          point => {

            const latitude =
              Number(
                point.latitude
              );

            const longitude =
              Number(
                point.longitude
              );

            if (
              !Number.isFinite(
                latitude
              ) ||
              !Number.isFinite(
                longitude
              )
            ) {

              return null;

            }

            return {

              latitude:
                latitude,

              longitude:
                longitude,

              recorded_at:
                point.created_at ||
                null

            };

          }
        )
        .filter(
          point =>
            point !== null
        );

    console.log(
      "VALID ROUTE POINTS:",
      validPoints
    );

    drawRoute(
      validPoints
    );

  } catch (error) {

    console.error(
      "LOAD ROUTE ERROR:",
      error
    );

    document.getElementById(
      "routePoints"
    ).textContent =
      "Хато";

    document.getElementById(
      "routeDistance"
    ).textContent =
      "Хато";

    document.getElementById(
      "routeDuration"
    ).textContent =
      "Хато";

  }

}


/* =====================================================
   DRAW ROUTE
===================================================== */

function drawRoute(
  points
) {

  if (
    !routeMap
  ) {

    return;

  }


  /* OLD LINE */

  if (
    routeLine
  ) {

    routeMap.removeLayer(
      routeLine
    );

    routeLine =
      null;

  }


  /* OLD MARKERS */

  routeMarkers.forEach(
    marker => {

      routeMap.removeLayer(
        marker
      );

    }
  );

  routeMarkers =
    [];


  /* STATS */

  document.getElementById(
    "routePoints"
  ).textContent =
    points.length;


  if (
    points.length === 0
  ) {

    document.getElementById(
      "routeDistance"
    ).textContent =
      "0.00 км";

    document.getElementById(
      "routeDuration"
    ).textContent =
      "00:00:00";

    routeMap.setView(
      [
        40.38,
        69.25
      ],
      13
    );

    return;

  }


  /* COORDINATES */

  const coordinates =
    points.map(
      point =>
        [
          point.latitude,
          point.longitude
        ]
    );


  /* DISTANCE */

  let totalDistance =
    0;

  for (
    let i = 1;
    i < points.length;
    i++
  ) {

    totalDistance +=
      calculateDistance(
        points[i - 1].latitude,
        points[i - 1].longitude,
        points[i].latitude,
        points[i].longitude
      );

  }


  document.getElementById(
    "routeDistance"
  ).textContent =
    totalDistance.toFixed(
      2
    ) +
    " км";


  /* DURATION */

  if (
    points.length >= 2 &&
    points[0].recorded_at &&
    points[
      points.length - 1
    ].recorded_at
  ) {

    const start =
      new Date(
        points[0].recorded_at
      );

    const end =
      new Date(
        points[
          points.length - 1
        ].recorded_at
      );

    const duration =
      end.getTime() -
      start.getTime();

    document.getElementById(
      "routeDuration"
    ).textContent =
      formatDuration(
        duration
      );

  } else {

    document.getElementById(
      "routeDuration"
    ).textContent =
      "00:00:00";

  }


  /* ONE POINT */

  if (
    points.length === 1
  ) {

    const marker =
      L.marker(
        coordinates[0]
      )
      .addTo(
        routeMap
      )
      .bindPopup(
        "📍 GPS нуқтаси"
      );

    routeMarkers.push(
      marker
    );

    routeMap.setView(
      coordinates[0],
      16
    );

    return;

  }


  /* POLYLINE */

  routeLine =
    L.polyline(
      coordinates,
      {
        weight: 5
      }
    ).addTo(
      routeMap
    );


  /* START */

  const startMarker =
    L.marker(
      coordinates[0]
    )
    .addTo(
      routeMap
    )
    .bindPopup(
      "🟢 Бошланиш нуқтаси"
    );


  /* END */

  const endMarker =
    L.marker(
      coordinates[
        coordinates.length - 1
      ]
    )
    .addTo(
      routeMap
    )
    .bindPopup(
      "🔴 Охирги нуқта"
    );


  routeMarkers.push(
    startMarker,
    endMarker
  );


  /* FIT MAP */

  routeMap.fitBounds(
    routeLine.getBounds(),
    {
      padding: [
        30,
        30
      ]
    }
  );

}


/* =====================================================
   HAVERSINE DISTANCE
===================================================== */

function calculateDistance(
  lat1,
  lon1,
  lat2,
  lon2
) {

  const R =
    6371;

  const dLat =
    (
      lat2 - lat1
    ) *
    Math.PI /
    180;

  const dLon =
    (
      lon2 - lon1
    ) *
    Math.PI /
    180;

  const a =
    Math.sin(
      dLat / 2
    ) *
    Math.sin(
      dLat / 2
    ) +

    Math.cos(
      lat1 *
      Math.PI /
      180
    ) *

    Math.cos(
      lat2 *
      Math.PI /
      180
    ) *

    Math.sin(
      dLon / 2
    ) *
    Math.sin(
      dLon / 2
    );

  const c =
    2 *
    Math.atan2(
      Math.sqrt(a),
      Math.sqrt(
        1 - a
      )
    );

  return R * c;

}


/* =====================================================
   FORMAT DURATION
===================================================== */

function formatDuration(
  milliseconds
) {

  if (
    !Number.isFinite(
      milliseconds
    ) ||
    milliseconds < 0
  ) {

    return "00:00:00";

  }

  const totalSeconds =
    Math.floor(
      milliseconds /
      1000
    );

  const hours =
    Math.floor(
      totalSeconds /
      3600
    );

  const minutes =
    Math.floor(
      (
        totalSeconds %
        3600
      ) /
      60
    );

  const seconds =
    totalSeconds %
    60;

  return (
    String(
      hours
    ).padStart(
      2,
      "0"
    ) +
    ":" +
    String(
      minutes
    ).padStart(
      2,
      "0"
    ) +
    ":" +
    String(
      seconds
    ).padStart(
      2,
      "0"
    )
  );

}
