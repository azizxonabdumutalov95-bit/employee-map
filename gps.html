<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>GPS kuzatuv</title>

  <!-- MUHIM: Telegram Web App API -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #f3f4f6;
      color: #222;
    }

    .container {
      max-width: 600px;
      margin: 0 auto;
    }

    .card {
      background: white;
      padding: 20px;
      border-radius: 16px;
      border: 1px solid #ddd;
      margin-bottom: 15px;
    }

    h2 {
      margin-top: 0;
    }

    .status {
      padding: 12px;
      border-radius: 10px;
      background: #f1f5f9;
      margin-bottom: 15px;
      line-height: 1.5;
    }

    .success {
      background: #dcfce7;
      color: #166534;
    }

    .error {
      background: #fee2e2;
      color: #991b1b;
    }

    .warning {
      background: #fef3c7;
      color: #92400e;
    }

    button {
      width: 100%;
      border: none;
      border-radius: 10px;
      padding: 14px;
      margin-top: 10px;
      font-size: 16px;
      cursor: pointer;
    }

    .start {
      background: #16a34a;
      color: white;
    }

    .stop {
      background: #dc2626;
      color: white;
    }

    .retry {
      background: #2563eb;
      color: white;
    }

    .info {
      background: #f8fafc;
      padding: 12px;
      border-radius: 10px;
      margin-top: 10px;
      font-family: monospace;
      word-break: break-word;
    }

    .label {
      font-weight: bold;
      margin-top: 12px;
    }

    .small {
      color: #666;
      font-size: 13px;
      margin-top: 10px;
      line-height: 1.5;
    }
  </style>
</head>

<body>

<div class="container">

  <div class="card">

    <h2>📍 GPS kuzatuv</h2>

    <div id="status" class="status">
      Telegram ma'lumotlari tekshirilmoqda...
    </div>

    <div class="label">
      Telegram ID:
    </div>

    <div id="telegramId" class="info">
      Aniqlanmoqda...
    </div>

    <div class="label">
      Xodim:
    </div>

    <div id="employeeName" class="info">
      Aniqlanmoqda...
    </div>

  </div>


  <div class="card">

    <button
      id="startButton"
      class="start"
      type="button"
    >
      📍 GPS'ni yoqish
    </button>

    <button
      id="stopButton"
      class="stop"
      type="button"
    >
      ⛔ GPS'ni to'xtatish
    </button>

    <button
      id="retryButton"
      class="retry"
      type="button"
    >
      🔄 Qayta tekshirish
    </button>

  </div>


  <div class="card">

    <div class="label">
      Oxirgi koordinata:
    </div>

    <div id="coordinates" class="info">
      Hali GPS yuborilmadi
    </div>

    <div class="label">
      Aniqlik:
    </div>

    <div id="accuracy" class="info">
      —
    </div>

    <div class="label">
      Oxirgi yuborilgan vaqt:
    </div>

    <div id="lastSent" class="info">
      —
    </div>

  </div>


  <div class="card">

    <div class="small">
      📡 GPS har 30 sekundda avtomatik yuboriladi.
      <br><br>
      Telegram oynasidan GPS ruxsatini berishingiz kerak.
    </div>

  </div>

</div>


<script>

const ENDPOINT =
  "https://qyvglgcjsqifyubmpahw.supabase.co/functions/v1/smart-endpoint";


const statusElement =
  document.getElementById("status");

const telegramIdElement =
  document.getElementById("telegramId");

const employeeNameElement =
  document.getElementById("employeeName");

const coordinatesElement =
  document.getElementById("coordinates");

const accuracyElement =
  document.getElementById("accuracy");

const lastSentElement =
  document.getElementById("lastSent");

const startButton =
  document.getElementById("startButton");

const stopButton =
  document.getElementById("stopButton");

const retryButton =
  document.getElementById("retryButton");


let telegramId = null;

let employee = null;

let gpsTimer = null;

let gpsRunning = false;


/* =========================================================
   TELEGRAM WEB APP
========================================================= */

function initializeTelegram() {

  try {

    if (
      window.Telegram &&
      window.Telegram.WebApp
    ) {

      const webApp =
        window.Telegram.WebApp;

      webApp.ready();

      try {
        webApp.expand();
      } catch {}

      console.log(
        "Telegram WebApp mavjud"
      );

      console.log(
        "initData:",
        webApp.initData
      );

      console.log(
        "initDataUnsafe:",
        webApp.initDataUnsafe
      );

    } else {

      console.log(
        "Telegram WebApp API topilmadi"
      );

    }

  } catch (error) {

    console.error(
      "Telegram WebApp ERROR:",
      error
    );

  }

}


/* =========================================================
   TELEGRAM ID
========================================================= */

function getTelegramId() {

  /*
   * 1. Telegram Web App
   */

  try {

    const webApp =
      window.Telegram?.WebApp;

    const id =
      webApp
        ?.initDataUnsafe
        ?.user
        ?.id;

    if (id) {

      console.log(
        "Telegram ID WebApp orqali:",
        id
      );

      return String(id);

    }

  } catch (error) {

    console.error(
      "WebApp ID xatosi:",
      error
    );

  }


  /*
   * 2. URL orqali
   */

  try {

    const params =
      new URLSearchParams(
        window.location.search
      );

    const urlId =
      params.get(
        "telegram_id"
      );

    if (urlId) {

      console.log(
        "Telegram ID URL orqali:",
        urlId
      );

      return String(urlId);

    }

  } catch (error) {

    console.error(
      "URL ID xatosi:",
      error
    );

  }


  /*
   * 3. Hech narsa topilmadi
   */

  return null;

}


/* =========================================================
   STATUS
========================================================= */

function setStatus(
  message,
  type = ""
) {

  statusElement.textContent =
    message;

  statusElement.className =
    "status " + type;

}


/* =========================================================
   LOAD EMPLOYEE
========================================================= */

async function loadEmployee() {

  telegramId =
    getTelegramId();


  telegramIdElement.textContent =
    telegramId || "Aniqlanmadi";


  if (!telegramId) {

    setStatus(
      "❌ Telegram ID aniqlanmadi. " +
      "Bu sahifani Telegram botdagi " +
      "📍 GPS'ni yoqish tugmasi orqali oching.",
      "error"
    );

    employeeNameElement.textContent =
      "Xodim aniqlanmadi";

    startButton.disabled =
      true;

    return false;

  }


  try {

    setStatus(
      "⏳ Xodim ma'lumotlari tekshirilmoqda..."
    );


    const response =
      await fetch(
        ENDPOINT +
        "?view=data&t=" +
        Date.now(),
        {
          method: "GET",
          cache: "no-store"
        }
      );


    const rawText =
      await response.text();


    let data;

    try {

      data =
        JSON.parse(
          rawText
        );

    } catch {

      throw new Error(
        "Server JSON qaytarmadi: " +
        rawText.substring(
          0,
          500
        )
      );

    }


    if (!response.ok) {

      throw new Error(
        data.error ||
        "Server xatosi"
      );

    }


    if (!Array.isArray(data)) {

      throw new Error(
        "Server noto'g'ri ma'lumot qaytardi."
      );

    }


    employee =
      data.find(
        item =>
          String(
            item.telegram_id
          ) === String(
            telegramId
          )
      );


    if (!employee) {

      employeeNameElement.textContent =
        "Xodim topilmadi";

      setStatus(
        "❌ Bu Telegram ID bilan xodim topilmadi.",
        "error"
      );

      startButton.disabled =
        true;

      return false;

    }


    employeeNameElement.textContent =
      employee.full_name ||
      "Noma'lum";


    setStatus(
      "✅ Xodim aniqlandi. GPS'ni yoqishingiz mumkin.",
      "success"
    );


    startButton.disabled =
      false;


    console.log(
      "EMPLOYEE:",
      employee
    );


    return true;


  } catch (error) {

    console.error(
      "EMPLOYEE LOAD ERROR:",
      error
    );


    setStatus(
      "❌ Xodim ma'lumotlarini olishda xato: " +
      String(error.message || error),
      "error"
    );


    return false;

  }

}


/* =========================================================
   SEND GPS
========================================================= */

function sendGpsPosition(
  position
) {

  const latitude =
    Number(
      position.coords.latitude
    );

  const longitude =
    Number(
      position.coords.longitude
    );

  const accuracy =
    Number(
      position.coords.accuracy
    );


  if (
    !Number.isFinite(latitude) ||
    !Number.isFinite(longitude)
  ) {

    setStatus(
      "❌ GPS koordinatasi noto'g'ri.",
      "error"
    );

    return;

  }


  coordinatesElement.textContent =
    "Latitude: " +
    latitude.toFixed(6) +
    " | Longitude: " +
    longitude.toFixed(6);


  accuracyElement.textContent =
    Number.isFinite(accuracy)
      ? accuracy.toFixed(1) + " metr"
      : "—";


  setStatus(
    "📡 GPS olinmoqda va serverga yuborilmoqda..."
  );


  fetch(
    ENDPOINT +
    "?view=location",
    {
      method: "POST",

      headers: {
        "Content-Type":
          "application/json"
      },

      body:
        JSON.stringify({
          telegram_id:
            Number(
              telegramId
            ),

          latitude,

          longitude
        })
    }
  )
  .then(
    async response => {

      const rawText =
        await response.text();

      let data;

      try {

        data =
          JSON.parse(
            rawText
          );

      } catch {

        throw new Error(
          "Server JSON qaytarmadi: " +
          rawText
        );

      }


      if (!response.ok) {

        throw new Error(
          data.error ||
          "GPS yuborishda server xatosi"
        );

      }


      if (
        data.success !== true
      ) {

        throw new Error(
          data.error ||
          data.message ||
          "GPS qabul qilinmadi"
        );

      }


      lastSentElement.textContent =
        new Date().toLocaleString(
          "uz-UZ"
        );


      setStatus(
        "✅ GPS muvaffaqiyatli yuborildi.",
        "success"
      );


      console.log(
        "GPS SENT:",
        data
      );

    }
  )
  .catch(
    error => {

      console.error(
        "GPS SEND ERROR:",
        error
      );


      setStatus(
        "❌ GPS yuborishda xato: " +
        String(
          error.message ||
          error
        ),
        "error"
      );

    }
  );

}


/* =========================================================
   GPS ERROR
========================================================= */

function gpsError(
  error
) {

  console.error(
    "GPS ERROR:",
    error
  );


  let message =
    "GPS xatosi.";


  if (
    error.code ===
    1
  ) {

    message =
      "❌ GPS ruxsati berilmadi. " +
      "Telefoningizda brauzer/Telegram uchun " +
      "Location ruxsatini yoqing.";

  }


  else if (
    error.code ===
    2
  ) {

    message =
      "❌ GPS joylashuvni aniqlay olmadi.";

  }


  else if (
    error.code ===
    3
  ) {

    message =
      "❌ GPS aniqlash vaqti tugadi.";

  }


  setStatus(
    message,
    "error"
  );

}


/* =========================================================
   GET GPS
========================================================= */

function getGps() {

  if (
    !navigator.geolocation
  ) {

    setStatus(
      "❌ Bu qurilmada GPS ishlamaydi.",
      "error"
    );

    return;

  }


  navigator.geolocation.getCurrentPosition(
    sendGpsPosition,

    gpsError,

    {
      enableHighAccuracy:
        true,

      timeout:
        20000,

      maximumAge:
        0
    }
  );

}


/* =========================================================
   START GPS
========================================================= */

async function startGps() {

  if (!telegramId) {

    setStatus(
      "❌ Telegram ID aniqlanmadi.",
      "error"
    );

    return;

  }


  if (
    !employee
  ) {

    const ok =
      await loadEmployee();

    if (!ok) {
      return;
    }

  }


  if (
    gpsRunning
  ) {

    setStatus(
      "🟢 GPS allaqachon ishlayapti.",
      "success"
    );

    return;

  }


  gpsRunning =
    true;


  setStatus(
    "📍 GPS yoqilmoqda..."
  );


  /*
   * Birinchi GPS darhol yuboriladi
   */

  getGps();


  /*
   * Keyingi GPS har 30 sekundda
   */

  gpsTimer =
    setInterval(
      getGps,
      30000
    );


  startButton.disabled =
    true;

}


/* =========================================================
   STOP GPS
========================================================= */

function stopGps() {

  gpsRunning =
    false;


  if (
    gpsTimer
  ) {

    clearInterval(
      gpsTimer
    );

    gpsTimer =
      null;

  }


  startButton.disabled =
    false;


  setStatus(
    "⛔ GPS kuzatuv to'xtatildi.",
    "warning"
  );

}


/* =========================================================
   BUTTONS
========================================================= */

startButton.addEventListener(
  "click",
  startGps
);


stopButton.addEventListener(
  "click",
  stopGps
);


retryButton.addEventListener(
  "click",
  async () => {

    setStatus(
      "🔄 Qayta tekshirilmoqda..."
    );

    await loadEmployee();

  }
);


/* =========================================================
   PAGE CLOSE
========================================================= */

window.addEventListener(
  "beforeunload",
  () => {

    if (gpsTimer) {

      clearInterval(
        gpsTimer
      );

    }

  }
);


/* =========================================================
   START
========================================================= */

initializeTelegram();

loadEmployee();

</script>

</body>
</html>
